<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InmoFlow</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#14212b; --muted:#64748b; --line:#e2e8f0;
  --pri:#0f766e; --pri-2:#115e59; --pri-soft:#ccfbf1;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --info:#1d4ed8; --info-soft:#dbeafe;
  --blue:#6d28d9; --blue-soft:#ede9fe;
  --r:12px; --sh:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1218; --card:#121c24; --ink:#e2e8f0; --muted:#94a3b8; --line:#23313d;
    --pri:#2dd4bf; --pri-2:#5eead4; --pri-soft:#123c38;
    --ok:#4ade80; --ok-soft:#12321f; --warn:#fbbf24; --warn-soft:#3a2c0b;
    --bad:#f87171; --bad-soft:#3b1414; --info:#93c5fd; --info-soft:#14284a;
    --blue:#c4b5fd; --blue-soft:#271d47;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1218; --card:#121c24; --ink:#e2e8f0; --muted:#94a3b8; --line:#23313d;
  --pri:#2dd4bf; --pri-2:#5eead4; --pri-soft:#123c38;
  --ok:#4ade80; --ok-soft:#12321f; --warn:#fbbf24; --warn-soft:#3a2c0b;
  --bad:#f87171; --bad-soft:#3b1414; --info:#93c5fd; --info-soft:#14284a;
  --blue:#c4b5fd; --blue-soft:#271d47;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hdr{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1280px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo b{color:var(--pri)}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--pri);display:grid;place-items:center;color:#fff;font-size:15px}
.hdr-sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;border:1px solid var(--line);padding:4px 10px;border-radius:99px;background:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.dot.on{background:#16a34a}.dot.busy{background:#f59e0b}.dot.err{background:#dc2626}
.vista{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1280px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer;position:relative}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.tab .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:16px}
.page{display:none}.page.on{display:block}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
h3{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1;min-width:160px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.card+.card{margin-top:12px}
.grid>.card+.card{margin-top:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme="dark"] .btn.p{color:#04201d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.p{color:#04201d}}
.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);min-width:0}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
textarea.f{resize:vertical;min-height:70px}
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:10px}
.fsec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--pri);margin:16px 0 8px;padding-top:10px;border-top:1px dashed var(--line)}
.fsec:first-child{border-top:0;padding-top:0;margin-top:0}
.hint{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--bg);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
tfoot td{font-weight:800;background:var(--bg)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--info-soft);color:var(--info)}
.t-blue{background:var(--blue-soft);color:var(--blue)}.t-mut{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.usd-o{color:var(--info)}.usd-b{color:var(--blue)}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.alert .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.alert.warn .ic{background:var(--warn-soft);color:var(--warn)}
.alert.bad .ic{background:var(--bad-soft);color:var(--bad)}
.alert.info .ic{background:var(--info-soft);color:var(--info)}
.alert.ok .ic{background:var(--ok-soft);color:var(--ok)}
.alert .tx{flex:1;min-width:0}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap}
.pcard{cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--pri)}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard .nm{font-weight:800;font-size:15px}
.meter{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--pri)}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
.row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.subtabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:600;font-size:12px;cursor:pointer}
.subtabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.back{margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.mbg.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:980px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh h3{margin:0}
.mb{padding:16px;max-height:72vh;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.calc{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.lines .ln{display:grid;grid-template-columns:1fr 140px 32px;gap:6px;margin-bottom:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-weight:600;display:none;max-width:90vw}
.upd{display:none;background:var(--pri);color:#fff;text-align:center;padding:8px;font-weight:700;cursor:pointer}
.docs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.doc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);font-size:12px}
.doc .th{height:100px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:18px;cursor:pointer;background-size:cover;background-position:center}
.doc .ds{padding:6px 8px}
.doc .ds div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart .bar2{width:100%;max-width:34px;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
.chart .lb{font-size:10px;color:var(--muted);white-space:nowrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.copy{cursor:pointer;border-bottom:1px dotted var(--muted)}
/* ── gráficos ── roles de color de la paleta de referencia (validada para daltonismo) */
:root{--s1:#2a78d6;--s2:#eb6834;--st-good:#0ca30c;--st-warn:#fab219;--st-serious:#ec835a;--st-crit:#d03b3b;--v-grid:#e1e0d9;--v-base:#c3c2b7;--v-muted:#898781;--v-surface:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--v-grid:#2c2c2a;--v-base:#383835;--v-surface:#121c24}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--v-grid:#2c2c2a;--v-base:#383835;--v-surface:#121c24}
.viz{width:100%;min-height:60px;position:relative}
.viz svg{display:block;overflow:visible;font-family:inherit}
.v-grid{stroke:var(--v-grid);stroke-width:1}
.v-base{stroke:var(--v-base);stroke-width:1}
.v-meta{stroke:var(--ink);stroke-width:1;opacity:.55}
.v-proy{stroke:var(--s1);stroke-width:2;stroke-dasharray:4 4;opacity:.6}
.v-cross{stroke:var(--v-muted);stroke-width:1}
.v-tick{fill:var(--v-muted);font-size:11px;font-variant-numeric:tabular-nums}
.v-lab{fill:var(--muted);font-size:12px}
.v-val{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.v-bar{transition:opacity .12s}
.v-bar.on{opacity:1}
.v-hl{fill:var(--ink);opacity:.05}
.v-dot{stroke:var(--v-surface);stroke-width:2}
.v-dot-proy{fill:var(--v-surface);stroke:var(--s1)}
.v-rowhit:hover,.v-rowhit:focus{fill:var(--ink);fill-opacity:.04;outline:none}
.v-stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.v-seg{min-width:4px;cursor:default;transition:filter .12s}
.v-seg:hover,.v-seg:focus{filter:brightness(1.12);outline:none}
.v-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.v-li{display:inline-flex;align-items:center;gap:6px}
.v-li i{width:10px;height:10px;border-radius:3px;display:inline-block}
.v-li b{color:var(--ink);font-weight:600}
.v-key{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:-2px 0 8px;flex-wrap:wrap}
.v-key span{display:inline-flex;align-items:center;gap:6px}
.v-key i{display:inline-block;width:10px;height:10px;border-radius:3px}
.v-key i.l{height:2px;width:14px;border-radius:1px}
.vtip{position:fixed;z-index:95;display:none;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:8px 10px;font-size:12px;min-width:150px;max-width:260px}
.vtip-h{color:var(--muted);font-weight:600;margin-bottom:4px}
.vtip-r{display:flex;align-items:center;gap:7px;padding:1px 0}
.vtip-r b{font-variant-numeric:tabular-nums;font-size:13px}
.vtip-r span{color:var(--muted)}
.vtip-r i.k-l{width:12px;height:2px;border-radius:1px;flex:0 0 auto}
.vtip-r i.k-b{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg-ctl button{border:0;background:none;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg-ctl button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.card-h h3{margin:0}
/* inmuebles por dueño */
.duenos{display:flex;flex-direction:column;gap:12px}
.dueno{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.dueno.open{border-color:var(--pri)}
.dueno-h{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:0;background:none;cursor:pointer;text-align:left;flex-wrap:wrap}
.dueno-h:hover{background:var(--bg)}
.avs{display:flex}
.av{width:42px;height:42px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;border:3px solid var(--card)}
.av+.av{margin-left:-12px;background:var(--pri-2)}
.dueno-n{display:flex;flex-direction:column;flex:1;min-width:180px}
.dueno-n b{font-size:16px}
.dueno-k{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);font-size:14px;width:16px;text-align:center}
.dueno-b{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));padding:4px 18px 18px;border-top:1px solid var(--line);padding-top:16px;background:var(--bg)}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--pri);transform:translateY(-1px)}
.tile-t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tile-r{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:4px}
.tile-add{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;font-weight:600}
.tile-add span{font-size:22px;line-height:1}
@media (max-width:640px){.dueno-k{display:none}.dueno-h{padding:14px}}
/* liquidación tipo planilla */
.liq-col h3{display:flex;justify-content:space-between;align-items:center}
.liq-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 4px}
.liq-tot{display:flex;justify-content:space-between;font-weight:800;padding:8px 0;border-top:1px solid var(--line);margin-top:4px;font-variant-numeric:tabular-nums}
.liq-final{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:17px;padding:12px;border-radius:10px;margin-top:12px;background:var(--pri-soft);font-variant-numeric:tabular-nums}
.liq-final.neg{background:var(--bad-soft)}
.neg-v{color:var(--bad)}
.recep{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);font-size:12px;max-width:170px}
.recibo-prev{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
/* sesión y roles */
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:28px 24px;width:100%;max-width:380px}
.sim-bar{display:none;background:var(--warn);color:#fff;text-align:center;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13px}
body.simulando .sim-bar{display:block}
.user-chip{display:flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);padding:3px 10px 3px 3px;border-radius:99px;background:var(--bg);cursor:pointer;white-space:nowrap}
.user-chip .av{width:24px;height:24px;font-size:10px;border-width:0}
.ro-tag{font-size:10px;font-weight:800;background:var(--info-soft);color:var(--info);border-radius:99px;padding:1px 7px}
.audit{margin-top:12px;padding-top:8px;border-top:1px dashed var(--line)}
@media (max-width:640px){.user-chip span.nm{display:none}}
@media (max-width:640px){
  main{padding:12px}
  .hdr-row{padding:8px 12px;flex-wrap:wrap}
  .kpi .v{font-size:18px}
  .mbg{padding:0}
  .modal{border-radius:0;min-height:100vh}
  .mb{max-height:none}
  .lines .ln{grid-template-columns:1fr 110px 32px}
  .kv{grid-template-columns:110px 1fr}
}
@media print{.hdr,.bar,.btn,.tabs{display:none!important}main{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="upd" id="upd" onclick="location.reload()">Hay una versión nueva de InmoFlow — tocá para actualizar</div>
<div class="sim-bar" onclick="simularDueno(null)">Estás viendo InmoFlow como lo ve el dueño (solo lectura) — tocá acá para volver a la vista de administrador</div>
<div class="login" id="login"></div>
<header class="hdr">
  <div class="hdr-row">
    <div class="logo"><div class="logo-mark">⌂</div><span>Inmo<b>Flow</b></span></div>
    <div class="hdr-sp"></div>
    <select class="vista" id="vista" onchange="setVista(this.value)" title="Ver montos como"></select>
    <div id="userchip"></div>
    <div class="sync" id="sync" onclick="clickSync()"><span class="dot" id="sdot"></span><span id="slabel">Local</span></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main">
  <section class="page" id="p-panel"></section>
  <section class="page" id="p-inmuebles"></section>
  <section class="page" id="p-contratos"></section>
