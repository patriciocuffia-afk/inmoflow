function graficosInmueble(i){
  var k = RENT_DOLAR === 'blue' ? 'blue' : 'oficial', r = rentabilidad(i);
  // eventos en orden: cobros suman, gastos operativos restan (en US$ de su fecha)
  var ev = [];
  vivos('pagos').filter(function(p){ return p.inmuebleId === i.id; }).forEach(function(p){ ev.push({ fecha: p.fecha, v: usdPago(p, k) * factor(p.distribucion || distribucionInm(i)) }); });
  vivos('gastos').filter(function(g){ return g.inmuebleId === i.id && !g.capital && g.pagadoPor !== 'locatario'; }).forEach(function(g){ ev.push({ fecha: g.fecha, v: -usdGasto(g, k) * factor(g.distribucion || distribucionInm(i)) }); });
  ev.sort(function(a, b){ return a.fecha < b.fecha ? -1 : 1; });
  var acum = 0, pts = [];
  ev.forEach(function(e){ acum += e.v; if (pts.length && pts[pts.length - 1].fecha === e.fecha) pts[pts.length - 1].acum = acum; else pts.push({ fecha: e.fecha, acum: acum }); });
  if (pts.length) pts.unshift({ fecha: addDias(pts[0].fecha, -1), acum: 0 });
  vizRecupero($('ri-curva'), { puntos: pts, meta: k === 'blue' ? r.costoBl : r.costoOf, anual: k === 'blue' ? r.anualBl : r.anualOf });
  // neto por mes, últimos 12
  var meses = []; for (var n = 11; n >= 0; n--) meses.push(perAdd(perHoy(), -n));
  var vals = meses.map(function(m){ return sum(ev.filter(function(e){ return per(e.fecha) === m; }), function(e){ return e.v; }); });
  vizColumnas($('ri-mes'), {
    cats: meses, etiquetas: meses.map(perCorto), barras: { valores: vals, color: 'var(--s1)' }, alto: 180,
    fmtEje: function(v){ return compacto(v, 'US$ '); },
    tip: function(x){ return { titulo: perNom(meses[x]), filas: [{ v: fmtU2(vals[x]), l: 'neto del mes', c: 'var(--s1)' }] }; }
  });
}

  return (c.observaciones && c.observaciones.length ? '<div class="alert warn"><div class="ic">!</div><div class="tx"><b>Para revisar (surgió al cargar el contrato)</b><ul class="small" style="margin:4px 0 0;padding-left:18px">' + c.observaciones.map(function(o){ return '<li>' + esc(o) + '</li>'; }).join('') + '</ul></div></div>' : '') +
    '<div class="grid g2">' + persona(c.locatario, 'Locatario') + (c.colocatarios || []).map(function(g){ return persona(g, 'Co-locatario'); }).join('') +
    (c.locadorFormal ? '<div class="card"><h3>Locador según contrato</h3><div>' + esc(c.locadorFormal) + '</div></div>' : '') + (c.garantes || []).map(function(g, k){ return persona(g, 'Garante ' + (k + 1)); }).join('') +
    '<div class="card"><h3>Condiciones</h3><div class="kv"><div>Destino</div><div>' + esc(c.destino || '') + '</div><div>Vencimiento</div><div>día ' + (c.diaVencimiento || DB.config.diaVencimiento) + ' de cada mes</div><div>Punitorio</div><div>' + pct(c.punitorioPct !== '' && c.punitorioPct != null ? c.punitorioPct : DB.config.punitorioDiarioPct, 2) + ' diario</div><div>Comisión adm.</div><div>' + pct(com, 2) + ' mensual</div><div>Honorarios</div><div>' + (function(){ var h = honorariosContrato(c); return h.monto ? fmt(h.monto) + ' (' + pct(h.pct, 2) + (h.baseTipo === 'total' ? ' del contrato' : ' de un mes') + ', a cargo del ' + h.paga + ', ' + perNom(h.mes) + ')' : '—'; })() + '</div><div>Depósito</div><div>' + (c.deposito ? fmt(c.deposito) : '—') + '</div></div>' +
    (c.notas ? '<div class="hint" style="margin-top:8px;white-space:pre-wrap">' + esc(c.notas) + '</div>' : '') +
    '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">' + (conFirebase() ? '<button class="btn sm p" onclick="darAccesoLocatario(\'' + c.id + '\')">Dar acceso a la app al locatario</button>' : '') + (estadoContrato(c) === 'vigente' || estadoContrato(c) === 'futuro' ? '<button class="btn sm" onclick="finalizarContrato(\'' + c.id + '\')">Finalizar contrato</button>' : '<button class="btn sm" onclick="reactivarContrato(\'' + c.id + '\')">Reactivar</button>') + '</div></div></div>';
}
// ═══════════════════════════════════════════
// COBROS (pagos de alquiler) y RECIBOS
// ═══════════════════════════════════════════
var FILTRO_PAG = { desde: perAdd(perHoy(), -2), hasta: perHoy(), q: '' };
var MEDIOS = ['Transferencia', 'Efectivo', 'Depósito', 'Cheque', 'Mercado Pago', 'Otro'];

function renderPagos(){
  var lista = vivos('pagos').filter(function(p){
    if (p.periodo < FILTRO_PAG.desde || p.periodo > FILTRO_PAG.hasta) return false;
    if (VISTA !== 'total' && !factor(p.distribucion)) return false;
    var q = FILTRO_PAG.q.toLowerCase(); if (!q) return true;
    var c = byId('contratos', p.contratoId);
    return ((c ? etiquetaContrato(c) : '') + ' ' + (p.reciboNro || '')).toLowerCase().indexOf(q) >= 0;
  });
  $('p-pagos').innerHTML = '<h2>Cobros</h2><p class="sub">Cada cobro calcula solo la comisión, el neto y su equivalente en dólar oficial y blue a la fecha de pago.</p>' +
    '<div class="bar"><input class="f grow" placeholder="Buscar locatario, inmueble o N° de recibo…" value="' + esc(FILTRO_PAG.q) + '" oninput="FILTRO_PAG.q=this.value;renderPagos();this.focus();this.setSelectionRange(this.value.length,this.value.length)">' +
    '<input class="f" style="width:auto" type="month" value="' + FILTRO_PAG.desde + '" onchange="FILTRO_PAG.desde=this.value;renderPagos()"><span class="muted">a</span><input class="f" style="width:auto" type="month" value="' + FILTRO_PAG.hasta + '" onchange="FILTRO_PAG.hasta=this.value;renderPagos()">' +
    '<button class="btn" onclick="exportarExcel(\'pagos\')">Excel</button><button class="btn p" onclick="modalPago()">+ Registrar cobro</button></div>' + tablaPagos(lista);
}
function tablaPagos(lista){
  if (!lista.length) return '<div class="card empty">No hay cobros en este rango.</div>';
  lista = lista.slice().sort(function(a, b){ return a.fecha < b.fecha ? 1 : -1; });
  var T = { tot: 0, com: 0, net: 0, of: 0, bl: 0 };
  var rows = lista.map(function(p){
    var c = byId('contratos', p.contratoId), f = factor(p.distribucion);
    var t = totalPago(p) * f, co = num(p.comision) * f, n = netoPago(p) * f, of = usdPago(p, 'oficial') * f, bl = usdPago(p, 'blue') * f;
    T.tot += t; T.com += co; T.net += n; T.of += of; T.bl += bl;
    return '<tr class="click" onclick="modalPago(\'' + p.id + '\')"><td>' + fDate(p.fecha) + '</td><td>' + perNom(p.periodo) + '</td><td><b>' + esc(c ? c.locatario.nombre : '—') + '</b><div class="small muted">' + esc(nombreInm(p.inmuebleId)) + '</div></td>' +
      '<td class="n">' + fmt(t) + '</td><td class="n">' + fmt(co) + '</td><td class="n b">' + fmt(n) + '</td><td class="n usd-o">' + fmtU(of) + '</td><td class="n usd-b">' + fmtU(bl) + '</td>' +
      '<td onclick="event.stopPropagation()"><button class="btn sm" onclick="reciboPDF(\'' + p.id + '\')">Recibo ' + esc(p.reciboNro || '') + '</button></td></tr>';
  }).join('');
  return '<div class="tw"><table><thead><tr><th>Fecha</th><th>Período</th><th>Locatario / inmueble</th><th class="n">Cobrado</th><th class="n">Comisión</th><th class="n">Neto</th><th class="n">US$ oficial</th><th class="n">US$ blue</th><th></th></tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td colspan="3">Total (' + lista.length + ')</td><td class="n">' + fmt(T.tot) + '</td><td class="n">' + fmt(T.com) + '</td><td class="n">' + fmt(T.net) + '</td><td class="n usd-o">' + fmtU(T.of) + '</td><td class="n usd-b">' + fmtU(T.bl) + '</td><td></td></tr></tfoot></table></div>';
}

function primerPeriodoImpago(c){
  var cc = cuentaCorriente(c), f = cc.filas.filter(function(x){ return x.estado !== 'pagado'; })[0];
  return f ? f.periodo : perAdd(cc.filas.length ? cc.filas[cc.filas.length - 1].periodo : perHoy(), cc.filas.length ? 1 : 0);
}
function comisionPctDe(c){ return c && c.comisionPct !== '' && c.comisionPct != null ? num(c.comisionPct) : num(DB.config.comisionPct); }

var _pagoExtras = [];
function modalPago(id, contratoId, periodo){
  var p = id ? JSON.parse(JSON.stringify(byId('pagos', id))) : null;
  var ctrs = vivos('contratos').filter(function(c){ return estadoContrato(c) !== 'finalizado' || c.id === contratoId || (p && c.id === p.contratoId); })
    .sort(function(a, b){ return etiquetaContrato(a).localeCompare(etiquetaContrato(b)); });
  if (!ctrs.length) { toast('Primero cargá un contrato'); return; }
  var c = byId('contratos', p ? p.contratoId : (contratoId || ctrs[0].id));
  if (!p) {
    var per0 = periodo || primerPeriodoImpago(c);
    var fila = cuentaCorriente(c).filas.filter(function(f){ return f.periodo === per0; })[0];
    // por defecto, el mismo receptor y medio que el último cobro de este contrato
    var ult = pagosDe(c.id).filter(function(x){ return x.medio !== 'Planilla'; }).sort(function(a, b){ return a.fecha < b.fecha ? 1 : -1; })[0];
    p = { contratoId: c.id, periodo: per0, fecha: hoy(), alquiler: fila ? Math.max(0, fila.debe - fila.pagado) : montoVigente(c, per0), punitorios: 0, extras: [], descuento: 0, medio: ult ? ult.medio : 'Transferencia', comisionPct: comisionPctDe(c),
      recibio: ult && ult.recibio && ult.recibio.length === 1 ? [{ quien: ult.recibio[0].quien, monto: 0 }] : null };
  }
  _pagoExtras = (p.extras || []).slice();
  var rec = p.recibio && p.recibio.length ? p.recibio : [{ quien: DB.config.receptorDefault || 'admin', monto: 0 }];
  var recSel = rec.length > 1 ? 'split' : rec[0].quien;
  abrirModal(id ? 'Cobro — recibo N° ' + esc(p.reciboNro || '') : 'Registrar cobro',
    '<div class="fr">' + sel('g-ctr', 'Contrato', ctrs.map(function(x){ return [x.id, etiquetaContrato(x)]; }), c.id, 'onchange="pagoCambiaContrato()"') + '</div>' +
    '<div class="fr">' + inp('g-per', 'Período que paga', p.periodo, 'month', 'onchange="pagoCambiaPeriodo()"') + inp('g-fecha', 'Fecha de pago', p.fecha, 'date', 'onchange="pagoCotiz();pagoCalc()"') + sel('g-medio', 'Medio', MEDIOS, p.medio) + '</div>' +
    '<div class="fr">' + sel('g-recq', '¿Quién recibió el dinero?', receptores().concat([['split', 'Dividido entre varios…']]), recSel, 'onchange="pagoRecep()"') + '</div>' +
    '<div class="fr" id="g-split" style="display:none">' + receptores().map(function(r){ var x = rec.filter(function(y){ return y.quien === r[0]; })[0]; return inp('g-rm-' + r[0], r[1], x && rec.length > 1 ? x.monto : '', 'number', 'step="0.01" oninput="pagoCalc()"'); }).join('') + '</div>' +
    '<div class="fr">' + inp('g-alq', 'Alquiler', p.alquiler, 'number', 'step="0.01" oninput="pagoCalc()"') + '<div><label class="l" for="g-pun">Punitorios <a href="#" onclick="pagoPunitorio();return false">calcular</a></label><input class="f" id="g-pun" type="number" step="0.01" value="' + esc(p.punitorios || 0) + '" oninput="pagoCalc()"></div>' + inp('g-desc', 'Descuento / bonificación', p.descuento || 0, 'number', 'step="0.01" oninput="pagoCalc()"') + '</div>' +
    '<label class="l">Otros conceptos (expensas, servicios, tasas…)</label><div class="lines" id="g-extras"></div><button class="btn sm" onclick="_pagoExtras.push({concepto:\'\',monto:0,tipo:\'reintegro\'});pagoExtrasRender()">+ Concepto</button>' +
    '<div class="fr" style="margin-top:12px">' + inp('g-com', 'Comisión administrador %', p.comisionPct, 'number', 'step="0.01" oninput="pagoCalc()"') + inp('g-cof', 'Dólar oficial (venta) del día', p.cotOf || '', 'number', 'step="0.01" oninput="pagoCalc()"') + inp('g-cbl', 'Dólar blue (venta) del día', p.cotBl || '', 'number', 'step="0.01" oninput="pagoCalc()"') + '</div>' +
    '<div class="calc" id="g-calc"></div>' +
    '<div style="margin-top:10px">' + inp('g-nota', 'Nota (sale en el recibo)', p.nota) + '</div>' + lineaAuditoria(id ? p : null),
    (id ? '<button class="btn d" onclick="eliminarPago(\'' + id + '\')">Eliminar</button><span style="flex:1"></span><button class="btn" onclick="reciboPDF(\'' + id + '\')">Recibo PDF</button>' : '') +
    '<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn p" onclick="guardarPago(\'' + (id || '') + '\')">' + (id ? 'Guardar' : 'Guardar y emitir recibo') + '</button>', true);
  pagoExtrasRender();
  if (!p.cotOf) pagoCotiz();
  pagoRecep();
}
// Receptores posibles del dinero: la administración (caja) o cualquiera de los socios.
function receptores(){ return [['admin', 'Administración (' + (DB.config.administrador || 'caja') + ')']].concat(DB.config.socios.map(function(s){ return [s.id, s.nombre]; })); }
function nombreReceptor(q){ return q === 'admin' ? (DB.config.administrador || 'Administración') : nombreSocio(q); }
function recibioDe(p){ return p.recibio && p.recibio.length ? p.recibio : [{ quien: 'admin', monto: totalPago(p) }]; }
function pagoRecep(){ $('g-split').style.display = val('g-recq') === 'split' ? '' : 'none'; pagoCalc(); }
function pagoExtrasRender(){
  $('g-extras').innerHTML = _pagoExtras.map(function(e, k){
    return '<div class="ln" style="grid-template-columns:1fr 120px 130px 32px"><input class="f" placeholder="Concepto" value="' + esc(e.concepto) + '" oninput="_pagoExtras[' + k + '].concepto=this.value">' +
      '<input class="f" type="number" step="0.01" value="' + esc(e.monto) + '" oninput="_pagoExtras[' + k + '].monto=num(this.value);pagoCalc()">' +
      '<select class="f" onchange="_pagoExtras[' + k + '].tipo=this.value;pagoCalc()" title="¿Es renta del propietario o un reintegro de algo que se paga a terceros?"><option value="reintegro"' + (e.tipo !== 'ingreso' ? ' selected' : '') + '>Reintegro</option><option value="ingreso"' + (e.tipo === 'ingreso' ? ' selected' : '') + '>Ingreso</option></select>' +
      '<button class="btn sm ghost" onclick="_pagoExtras.splice(' + k + ',1);pagoExtrasRender();pagoCalc()">✕</button></div>';
  }).join('');
}
function pagoCambiaContrato(){
  var c = byId('contratos', val('g-ctr')); $('g-per').value = primerPeriodoImpago(c); $('g-com').value = comisionPctDe(c); pagoCambiaPeriodo();
}
function pagoCambiaPeriodo(){
  var c = byId('contratos', val('g-ctr')), pp = val('g-per');
  var f = cuentaCorriente(c).filas.filter(function(x){ return x.periodo === pp; })[0];
  $('g-alq').value = f ? Math.max(0, f.debe - f.pagado) : montoVigente(c, pp);
  $('g-pun').value = 0; pagoCalc();
}
function pagoCotiz(){ var f = val('g-fecha'); $('g-cof').value = cotiz('oficial', f) || ''; $('g-cbl').value = cotiz('blue', f) || ''; }
function pagoPunitorio(){
  var c = byId('contratos', val('g-ctr')), r = punitorioSugerido(c, val('g-per'), val('g-fecha'), num(val('g-alq')));
  $('g-pun').value = r.monto; pagoCalc();
  toast(r.dias ? r.dias + ' días de mora' : 'Pagó en término: sin punitorios');
}
function pagoLeer(){
  var c = byId('contratos', val('g-ctr')), i = byId('inmuebles', c.inmuebleId);
  var p = {
    contratoId: c.id, inmuebleId: c.inmuebleId, periodo: val('g-per'), fecha: val('g-fecha'), medio: val('g-medio'),
    alquiler: num(val('g-alq')), punitorios: num(val('g-pun')), descuento: num(val('g-desc')),
    extras: _pagoExtras.filter(function(e){ return e.concepto || e.monto; }).map(function(e){ return { concepto: e.concepto || 'Otro', monto: num(e.monto), tipo: e.tipo || 'reintegro' }; }),
    comisionPct: num(val('g-com')), cotOf: num(val('g-cof')), cotBl: num(val('g-cbl')), nota: val('g-nota'),
    distribucion: distribucionInm(i).map(function(t){ return { socioId: t.socioId, pct: t.pct }; })
  };
  var base = DB.config.comisionBase === 'total' ? ingresoPago(p) - p.descuento : p.alquiler - p.descuento;
  p.comision = r2(Math.max(0, base) * p.comisionPct / 100);
  var q = val('g-recq');
  p.recibio = q === 'split'
    ? receptores().map(function(r){ return { quien: r[0], monto: num(val('g-rm-' + r[0])) }; }).filter(function(r){ return r.monto; })
    : [{ quien: q || 'admin', monto: totalPago(p) }];
  return p;
}
function pagoCalc(){
  if (!$('g-calc')) return;
  var p = pagoLeer(), n = netoPago(p), reint = sum(p.extras.filter(function(e){ return e.tipo === 'reintegro'; }), function(e){ return e.monto; });
  $('g-calc').innerHTML =
    '<div class="row"><span>Total que paga el locatario</span><span>' + fmt2(totalPago(p)) + '</span></div>' +
    (reint ? '<div class="row"><span class="muted">− Reintegros (no son renta)</span><span>' + fmt2(reint) + '</span></div>' : '') +
    '<div class="row"><span class="muted">− Comisión administrador (' + pct(p.comisionPct, 2) + ')</span><span>' + fmt2(p.comision) + '</span></div>' +
    '<div class="row" style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px"><span class="b">Neto propietario(s)</span><span>' + fmt2(n) + '</span></div>' +
    '<div class="row"><span>Equivale en dólar oficial</span><span class="usd-o">' + (p.cotOf ? fmtU2(n / p.cotOf) : '—') + '</span></div>' +
    '<div class="row"><span>Equivale en dólar blue</span><span class="usd-b">' + (p.cotBl ? fmtU2(n / p.cotBl) : '—') + '</span></div>' +
    (p.distribucion.length > 1 ? '<div class="small muted" style="margin-top:6px">Le corresponde a ' + p.distribucion.map(function(d){ return esc(nombreSocio(d.socioId)) + ' (' + d.pct + '%): <b>' + fmt(n * d.pct / 100) + '</b>'; }).join(' · ') + '</div>' : '') +
    (function(){
      var tr = sum(p.recibio, function(r){ return r.monto; }), dif = totalPago(p) - tr;
      var txt = 'Recibió el dinero: ' + p.recibio.map(function(r){ return esc(nombreReceptor(r.quien)) + ' ' + fmt(r.monto); }).join(' · ');
      return '<div class="small" style="margin-top:6px">' + txt + (Math.abs(dif) > 1 ? ' <span class="tag t-bad">faltan asignar ' + fmt(dif) + '</span>' : '') + '</div>';
    })();
}
function guardarPago(id){
  var p = pagoLeer();
  var difRec = totalPago(p) - sum(p.recibio, function(r){ return r.monto; });
  if (Math.abs(difRec) > 1) { toast('Lo recibido por cada uno (' + fmt(totalPago(p) - difRec) + ') no coincide con el total ' + fmt(totalPago(p))); return; }
  if (!p.periodo || !p.fecha) { toast('Completá período y fecha'); return; }
  if (!p.alquiler && !p.extras.length && !p.punitorios) { toast('Ingresá el monto cobrado'); return; }
  if (id) { var old = byId('pagos', id); p.id = id; p.reciboNro = old.reciboNro; p.creado = old.creado; }
  else {
    var dup = pagosDe(p.contratoId).filter(function(x){ return x.periodo === p.periodo; });
    var fila = cuentaCorriente(byId('contratos', p.contratoId)).filas.filter(function(f){ return f.periodo === p.periodo; })[0];
    if (dup.length && fila && fila.estado === 'pagado' && !window.confirm(perNom(p.periodo) + ' ya figura pagado. ¿Registrar otro cobro igual?')) return;
    p.reciboNro = DB.config.reciboPuntoVenta + '-' + String(DB.config.reciboNro).padStart(8, '0');
    DB.config.reciboNro++; guardarConfig();
  }
  guardar('pagos', p); cerrarModal(); renderTodo();
  toast('Cobro registrado — recibo ' + p.reciboNro);
  if (!id) reciboPDF(p.id, true);
}
function eliminarPago(id){ confirmar('¿Eliminar este cobro? El número de recibo no se reutiliza.').then(function(ok){ if (ok) { borrar('pagos', id); cerrarModal(); renderTodo(); } }); }

// RECIBOS: listado, vista previa, envío y emisión en lote
// Cada recibo nace de un cobro (así queda en la cuenta corriente y la liquidación).
// ═══════════════════════════════════════════
var FILTRO_REC = { desde: perAdd(perHoy(), -1), hasta: perHoy(), q: '' };

function recibosFiltrados(){
  return vivos('pagos').filter(function(p){
    if (p.periodo < FILTRO_REC.desde || p.periodo > FILTRO_REC.hasta) return false;
    if (VISTA !== 'total' && !factor(p.distribucion)) return false;
    var q = FILTRO_REC.q.toLowerCase(); if (!q) return true;
    var c = byId('contratos', p.contratoId);
    return ((c ? etiquetaContrato(c) : '') + ' ' + (p.reciboNro || '')).toLowerCase().indexOf(q) >= 0;
  }).sort(function(a, b){ return (b.fecha + (b.reciboNro || '')) > (a.fecha + (a.reciboNro || '')) ? 1 : -1; });
}
function renderRecibos(){

    '<div class="bar"><button class="btn p" onclick="modalPago()">+ Emitir recibo de alquiler</button><button class="btn" onclick="reciboOtroConcepto()">+ Recibo por otro concepto</button><span class="grow"></span>' +
      '<label class="small muted" for="rc-cop">Por hoja</label><select class="f" id="rc-cop" style="width:auto" onchange="DB.config.reciboCopias=this.value;guardarConfig()"><option value="dos"' + (copias === 'dos' ? ' selected' : '') + '>Original + duplicado</option><option value="una"' + (copias === 'una' ? ' selected' : '') + '>Solo original</option></select></div>' +
    '<div class="bar"><input class="f grow" placeholder="Buscar locatario, inmueble o N°…" value="' + esc(FILTRO_REC.q) + '" oninput="FILTRO_REC.q=this.value;renderRecibos();this.focus();this.setSelectionRange(this.value.length,this.value.length)">' +
      '<input class="f" style="width:auto" type="month" value="' + FILTRO_REC.desde + '" onchange="FILTRO_REC.desde=this.value;renderRecibos()"><span class="muted">a</span><input class="f" style="width:auto" type="month" value="' + FILTRO_REC.hasta + '" onchange="FILTRO_REC.hasta=this.value;renderRecibos()">' +
      '<button class="btn" onclick="recibosLote()"' + (l.length ? '' : ' disabled') + '>Todos en un PDF (' + l.length + ')</button></div>' +
    '<div class="kpis">' + kpi('Recibos', l.length, perNom(FILTRO_REC.desde) + (FILTRO_REC.hasta !== FILTRO_REC.desde ? ' a ' + perNom(FILTRO_REC.hasta) : '')) + kpi('Total recibido', fmt(sum(l, totalPago)), '') + kpi('Sin celular cargado', sinTel, sinTel ? 'no se pueden mandar por WhatsApp' : 'todos con WhatsApp') + '</div>' +
    (l.length ? '<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Período</th><th>Locatario / inmueble</th><th class="n">Importe</th><th>Medio</th><th></th></tr></thead><tbody>' +

var RENT_GRAF = 'rent';
// ═══════════════════════════════════════════
// LIQUIDACIÓN / RENDICIÓN MENSUAL POR SOCIO (como la planilla de la administradora)
//   Alquileres que le corresponden  − comisión administración  − su parte de los gastos
//   − lo que cobró él directamente  + gastos que adelantó  ± retiros, transferencias y ajustes
//   = NETO A COBRAR (positivo: se lo debe la administración; negativo: tiene de más)
// ═══════════════════════════════════════════
var LIQ = { per: perHoy(), modo: 'periodo' }; // modo: 'periodo' (mes que paga) | 'cobro' (fecha de cobro)
var TIPOS_MOV = [
  ['retiro', 'Retiro en efectivo (la administración le entrega)'],
  ['transferencia', 'Transferencia de la administración al socio'],
  ['aporte', 'Aporte del socio a la caja'],
  ['entre', 'Pago entre socios'],
  ['ajuste', 'Ajuste manual (+ a favor / − en contra)']
];

function cobrosDelMes(p){ return vivos('pagos').filter(function(x){ return LIQ.modo === 'cobro' ? per(x.fecha) === p : x.periodo === p; }); }
// Parte de lo recibido que es renta (lo que se paga a terceros —reintegros— queda fuera de la rendición).
function fraccionRenta(x){ var t = totalPago(x); return t > 0 ? (ingresoPago(x) - num(x.descuento)) / t : 0; }
function gastoEnRendicion(g){ return g.pagadoPor === 'admin' || String(g.pagadoPor).indexOf('socio:') === 0; }

function rendicion(p, socioId, conSaldo){
  var R = { alq: [], gastos: [], movs: [], totalAlq: 0, com: 0, totalGas: 0, totalMov: 0, saldoAnt: 0 };
  cobrosDelMes(p).forEach(function(x){
    var c = byId('contratos', x.contratoId), loc = c ? c.locatario.nombre : '—';
    var d = (x.distribucion || []).find(function(t){ return t.socioId === socioId; }), f = d ? num(d.pct) / 100 : 0;
    var recibio = recibioDe(x), fr = fraccionRenta(x);
    if (f) {
      var otros = recibio.filter(function(r){ return r.quien !== 'admin'; }).map(function(r){ return nombreReceptor(r.quien); });
      R.alq.push({ pago: x, loc: loc, inm: nombreInm(x.inmuebleId), pct: d.pct, monto: (ingresoPago(x) - num(x.descuento)) * f, com: num(x.comision) * f, recibio: otros });
    }
    recibio.forEach(function(r){
      if (r.quien === socioId && r.monto) R.movs.push({ tipo: 'cobro', txt: 'Cobró directo ' + titulo(loc) + (f < 1 ? ' (total, le toca ' + r2(f * 100) + '%)' : ''), monto: -r.monto * fr, pago: x });
    });
  });
  vivos('gastos').forEach(function(g){
    if (per(g.fecha) !== p || !gastoEnRendicion(g)) return;
    var d = (g.distribucion || distribucionInm(byId('inmuebles', g.inmuebleId))).find(function(t){ return t.socioId === socioId; });
    if (d && num(d.pct)) R.gastos.push({ gasto: g, txt: (g.descripcion || g.categoria) + ' — ' + nombreInm(g.inmuebleId) + (num(d.pct) < 100 ? ' (' + r2(d.pct) + '%)' : ''), monto: num(g.montoARS) * num(d.pct) / 100 });
    if (g.pagadoPor === 'socio:' + socioId) R.movs.push({ tipo: 'pagoGasto', txt: 'Pagó ' + (g.descripcion || g.categoria) + ' (se le reintegra)', monto: num(g.montoARS), gasto: g });
  });
  vivos('movimientos').forEach(function(m){
    if (per(m.fecha) !== p) return;
    var v = 0;
    if (m.socioId === socioId) v = m.tipo === 'retiro' || m.tipo === 'transferencia' ? -num(m.monto) : m.tipo === 'aporte' || m.tipo === 'entre' ? num(m.monto) : num(m.monto);
    else if (m.tipo === 'entre' && m.destinoId === socioId) v = -num(m.monto);
    if (v) R.movs.push({ tipo: 'mov', txt: textoMov(m, socioId), monto: v, mov: m });
  });
  // honorarios inmobiliarios (única vez) a cargo del locador, en el mes en que se liquidan
  R.hon = [];
  vivos('contratos').forEach(function(c){
    var h = honorariosContrato(c);
    if (!h.monto || h.paga !== 'locador' || h.mes !== p) return;
    var d = distribucionInm(byId('inmuebles', c.inmuebleId)).find(function(t){ return t.socioId === socioId; });
    if (!d || !num(d.pct)) return;
    R.hon.push({ contrato: c, txt: 'Honorarios inmobiliarios ' + titulo(c.locatario.nombre) + ' (' + pct(h.pct, 2) + (h.baseTipo === 'total' ? ' del contrato' : ' de un mes') + (num(d.pct) < 100 ? ', ' + r2(d.pct) + '%' : '') + ')', monto: h.monto * num(d.pct) / 100 });
  });
  R.alq.sort(function(a, b){ return a.loc.localeCompare(b.loc); });
  R.totalAlq = sum(R.alq, function(a){ return a.monto; });
  R.com = sum(R.alq, function(a){ return a.com; });
  R.totalHon = sum(R.hon, function(h){ return h.monto; });
  R.totalGas = sum(R.gastos, function(g){ return g.monto; });
  R.totalMov = sum(R.movs, function(m){ return m.monto; });
  R.netoMes = R.totalAlq - R.com - R.totalHon - R.totalGas + R.totalMov;
  var desde = DB.config.rendicionDesde;
  if (conSaldo && desde && desde < p) { for (var m = desde; m < p; m = perAdd(m, 1)) R.saldoAnt += rendicion(m, socioId, false).netoMes; }
  R.neto = R.netoMes + R.saldoAnt;
  return R;
}
function textoMov(m, socioId){
  var t = { retiro: 'Retiro en efectivo', transferencia: 'Transferencia de la administración', aporte: 'Aporte a la caja', ajuste: 'Ajuste' }[m.tipo];
  if (m.tipo === 'entre') t = m.socioId === socioId ? 'Le pagó a ' + nombreSocio(m.destinoId) : 'Recibió de ' + nombreSocio(m.socioId);
  return t + (m.concepto ? ' — ' + m.concepto : '') + ' (' + fDate(m.fecha) + ')';
}
// Caja de la administración en el mes: lo que entró a la administración menos lo que salió.
function cajaAdmin(p){
  var rec = sum(cobrosDelMes(p), function(x){ return sum(recibioDe(x).filter(function(r){ return r.quien === 'admin'; }), function(r){ return r.monto; }) * fraccionRenta(x); });
  var gas = sum(vivos('gastos').filter(function(g){ return per(g.fecha) === p && g.pagadoPor === 'admin'; }), function(g){ return g.montoARS; });
  var ms = vivos('movimientos').filter(function(m){ return per(m.fecha) === p; });
  var sal = sum(ms.filter(function(m){ return m.tipo === 'retiro' || m.tipo === 'transferencia'; }), function(m){ return m.monto; });
  var apo = sum(ms.filter(function(m){ return m.tipo === 'aporte'; }), function(m){ return m.monto; });
  var com = sum(cobrosDelMes(p), function(x){ return x.comision; });
  // honorarios del mes: los del locador salen de lo que se rinde; los del locatario los cobra la administración aparte
  var hon = 0, honLoc = 0;
  vivos('contratos').forEach(function(c){ var h = honorariosContrato(c); if (!h.monto || h.mes !== p) return; if (h.paga === 'locador') hon += h.monto; else honLoc += h.monto; });
  return { rec: rec, gas: gas, sal: sal, apo: apo, com: com, hon: hon, honLoc: honLoc, saldo: rec - gas - sal + apo - com - hon };
}

    (caja.apo ? '<div class="row"><span>Aportes de socios</span><span>' + fmt(caja.apo) + '</span></div>' : '') +

function htmlRendicion(s, R, p){

    function sec(t){ y += 1.5; doc.setFontSize(7); doc.setTextColor(100, 116, 139); doc.text(t, x0 + 1, y); doc.setTextColor(15, 23, 42); doc.setFontSize(8.5); y += 4.2; }

    doc.setFontSize(8.5);

    if (R.movs.length) { sec('RETIROS / TRANSFERENCIAS'); R.movs.forEach(function(m){ ln(m.txt, m.monto); }); }

    doc.setFontSize(10.5); ln('NETO A COBRAR', R.neto, true); doc.setFontSize(8.5);
  });
  doc.save('Liquidacion ' + perNom(p) + '.pdf');

    vencimiento: { nombre: 'Vencimiento de contrato', texto: 'Hola {locatario}, te recordamos que el contrato de {inmueble} finaliza el {fin}. Queremos saber si tenés intención de renovar para coordinar. {firma}' },
    recibo: { nombre: 'Confirmación de pago', texto: 'Hola {locatario}, recibimos tu pago de {ultimoPago} correspondiente a {ultimoPeriodo}. ¡Gracias! Te enviamos el recibo. {firma}' },
    libre: { nombre: 'Mensaje libre', texto: 'Hola {locatario}, ' }
  };
}
function variablesMsj(c, dest){
  var ph = perHoy(), pa = proximoAjuste(c), d = deudaContrato(c);
  var ms = montosOrd(c), ult = ms[ms.length - 1], ant = ms.length > 1 ? ms[ms.length - 2] : null;
  var aj = pa && (!ult || ult.desde < pa) ? calcularAjuste(c, pa) : null;
  var fila = cuentaCorriente(c).filas.filter(function(f){ return f.periodo === ph; })[0];
  var pagos = pagosDe(c.id).sort(function(a, b){ return a.fecha < b.fecha ? 1 : -1; });
  var i = byId('inmuebles', c.inmuebleId) || {};
  return {
    locatario: titulo(c.locatario.nombre),
    garante: dest && dest.nombre ? dest.nombre : ((c.garantes || [])[0] || {}).nombre || '',
    inmueble: i.direccion || i.nombre || '', direccion: i.direccion || '',
    periodo: perNom(ph), monto: fmt(montoVigente(c, ph)), vencimiento: fila ? fDate(fila.venc) : '',
    montoAnterior: aj ? fmt(aj.base) : (ant ? fmt(ant.monto) : ''), montoNuevo: aj ? fmt(aj.monto) : (ult ? fmt(ult.monto) : ''),
    desde: aj ? perNom(pa) : (ult ? perNom(ult.desde) : ''), indice: INDICES[c.indice] || c.indice,
    deuda: fmt(sum(d, function(f){ return f.debe - f.pagado; })), detalleDeuda: d.map(function(f){ return perNom(f.periodo); }).join(', ') || '—',
    fin: fDate(c.fin), firma: '\n' + (DB.config.administrador || DB.config.emisor || ''),
    ultimoPago: pagos[0] ? fmt(totalPago(pagos[0])) : '', ultimoPeriodo: pagos[0] ? perNom(pagos[0].periodo) : ''
  };
}
// "PEREZ JUANA" → "Perez Juana" para que el saludo no quede en mayúsculas.
function titulo(n){ return String(n || '').trim().toLowerCase().replace(/(^|[\s-])(\S)/g, function(m, a, b){ return a + b.toUpperCase(); }); }
function nombrePila(n){
  var p = String(n || '').trim().split(/\s+/);
  if (p.length < 2) return n;
  var s = p.length >= 3 ? p.slice(-1)[0] : p[1];
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}
function rellenar(t, v){ return t.replace(/\{(\w+)\}/g, function(m, k){ return v[k] != null ? v[k] : m; }); }
function telWA(t){
  var d = String(t || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.indexOf('54') === 0) { d = d.slice(2); }
  if (d.charAt(0) === '0') d = d.slice(1);
  if (d.charAt(0) === '9') d = d.slice(1);
  d = d.replace(/^(\d{2,4})15/, '$1');           // quita el 15 de celulares viejos
  return '549' + d;
}
function linkWA(tel, txt){ return 'https://wa.me/' + telWA(tel) + (txt ? '?text=' + encodeURIComponent(txt) : ''); }

// Comparte un archivo de Drive (solo lectura, sin mail) con los dueños que pueden ver ese registro.
var USUARIOS_CACHE = null;
function compartirConDuenos(driveId, col, obj){
  var socios = visiblePara(col, obj);
  var lista = USUARIOS_CACHE ? Promise.resolve(USUARIOS_CACHE) : (conFirebase() && esAdmin() ? fsListUsuarios().then(function(u){ return (USUARIOS_CACHE = u); }) : Promise.resolve([]));
  return lista.then(function(us){
    return Promise.all(us.filter(function(u){ return u.rol !== 'admin' && socios.indexOf(u.socioId) >= 0 && u.email; }).map(function(u){
      return fetch(DRIVE_FILES + '/' + driveId + '/permissions?sendNotificationEmail=false', { method: 'POST', headers: hdrs('application/json'), body: JSON.stringify({ role: 'reader', type: 'user', emailAddress: u.email }) });
    }));
  }).catch(function(e){ console.warn('compartir', e); });
}
function subirArchivos(col, id, files, cat, opts){
  var obj = byId(col, id); if (!obj || !files.length) return;
  if (conFirebase() && !AUTH_TOKEN && !tokenGuardado()) { conDrive(function(){ subirArchivos(col, id, files, cat); }); return; }
  var carpeta = col === 'inmuebles' ? obj.nombre : col === 'contratos' ? 'Contrato ' + obj.locatario.nombre : 'Comprobantes de gastos';
  toast('Subiendo ' + files.length + ' archivo(s)…', 60000);
  return files.reduce(function(acc, f){
    return acc.then(function(){
      var d = { id: uid(), nombre: f.name, tipo: f.type, size: f.size, fecha: hoy(), cat: cat };
      var p = AUTH_TOKEN ? driveSubir(f, carpeta).then(function(r){ d.driveId = r.id; d.url = r.webViewLink; return compartirConDuenos(r.id, col, obj); })
        : idbPut(d.id, f).then(function(){ d.local = true; });
      return p.then(function(){ obj.docs = (obj.docs || []).concat([d]); });
    });
  }, Promise.resolve()).then(function(){
    guardar(col, obj); if (!(opts && opts.silencioso)) toast('Archivos guardados');
    if (opts && opts.silencioso) return true;
    if (col === 'gastos') modalGasto(id); else renderTodo();
  }).catch(function(e){ console.error(e); toast('Error al subir: ' + e.message, 5000); });
}
function blobDoc(d){ return d.driveId && AUTH_TOKEN ? driveBlob(d.driveId) : idbGet(d.id); }
function abrirDoc(col, id, k){
  var d = (byId(col, id).docs || [])[k];
  // los dueños (y cualquiera sin permiso de Drive en esta sesión) lo abren en Google Drive, donde ya está compartido
  if (d.driveId && (!AUTH_TOKEN || soloLectura())) { if (d.url) window.open(d.url, '_blank'); else toast('Conectate con Google para abrirlo'); return; }
  var w = window.open('', '_blank');
  blobDoc(d).then(function(b){
    if (!b) { if (w) w.close(); toast('El archivo está guardado en otro dispositivo'); return; }
    var u = URL.createObjectURL(b); if (w) w.location = u; else window.open(u, '_blank');
  });
}
function quitarDoc(col, id, k){
  confirmar('¿Quitar este archivo?' + (AUTH_TOKEN ? ' (se mueve a la papelera de Drive)' : '')).then(function(ok){
    if (!ok) return;
    var o = byId(col, id), d = o.docs[k];
    if (d.driveId && AUTH_TOKEN) fetch(DRIVE_FILES + '/' + d.driveId, { method: 'PATCH', headers: hdrs('application/json'), body: JSON.stringify({ trashed: true }) });
    if (d.local) idbDel(d.id);
    o.docs.splice(k, 1); guardar(col, o);
    if (col === 'gastos') modalGasto(id); else renderTodo();
  });
}

function descargar(nombre, contenido, tipo){
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([contenido], { type: tipo || 'application/json' })); a.download = nombre; a.click();

function exportarBackup(){
  var d = { app: 'InmoFlow', version: APP_VERSION, fecha: new Date().toISOString(), config: DB.config };
  COLS.forEach(function(c){ d[c] = DB[c]; });
  descargar('inmoflow-backup-' + hoy() + '.json', JSON.stringify(d, null, 1));
}
function importarBackup(){
  var fi = $('fileIn'); fi.multiple = false; fi.accept = '.json,application/json';
  fi.onchange = function(){
    var f = fi.files[0]; fi.value = ''; if (!f) return;
    f.text().then(function(t){
      var d = JSON.parse(t); if (d.app !== 'InmoFlow') throw new Error('No es un backup de InmoFlow');
      var n = 0;
      COLS.forEach(function(c){ (d[c] || []).forEach(function(rem){ var i = DB[c].findIndex(function(x){ return x.id === rem.id; }); if (i < 0 || (rem.updatedAt || 0) > (DB[c][i].updatedAt || 0)) { if (i < 0) DB[c].push(rem); else DB[c][i] = rem; PENDIENTES[c + '/' + rem.id] = true; n++; } }); });
      if (d.config && (d.config.updatedAt || 0) > (DB.config.updatedAt || 0)) { DB.config = Object.assign(configBase(), d.config); PENDIENTES['config/config'] = true; }
      guardarLocal(); programarSync(); renderTodo(); toast(n + ' registros restaurados');
    }).catch(function(e){ alert('No se pudo restaurar: ' + e.message); });
  };
  fi.click();
}
function exportarExcel(que){

function sinAcentos(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function mesDeTexto(t, perRef){
  // celdas con formato fecha llegan como número de serie de Excel (días desde 30/12/1899)
  if (typeof t === 'number' || /^\d{5}(\.\d+)?$/.test(String(t).trim())) {
    var n = +t; if (n > 30000 && n < 80000) return new Date(Date.UTC(1899, 11, 30) + n * 864e5).toISOString().slice(0, 7);
    return null;
  }
  var s =sinAcentos(t).toLowerCase().replace('septimbre', 'septiembre').replace('setiembre', 'septiembre');
  for (var m = 0; m < 12; m++) {
    if (s.indexOf(sinAcentos(MESES[m]).toLowerCase()) >= 0) {
      var y = (s.match(/20\d\d/) || [])[0];
      if (y) return y + '-' + p2(m + 1);
      var cand = perRef.slice(0, 4) + '-' + p2(m + 1);
      return cand < perRef ? perAdd(cand, 12) : cand;
    }
  }
  return null;
}
function limpiarNombre(n){ return String(n || '').replace(/\(.*$/, '').replace(/\b\d+\/\d+\s*mes\b/i, '').replace(/\s+/g, ' ').trim().toUpperCase(); }
function slug(s){ return sinAcentos(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

function analizarPlanilla(wb){
  var meses = [], datos = {}; // datos[nombre] = { meses: {per: {socioId: monto, nota, reaj}} }
  wb.SheetNames.forEach(function(sn){
    var p = mesDeTexto(sn, '2000-01'); var y = (sn.match(/20\d\d/) || [])[0];
    if (!p || !y) return;
    p = y + p.slice(4);
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
    var hdr = null, hi = -1;
    for (var r = 0; r < Math.min(6, rows.length); r++) if (rows[r].some(function(x){ return /BENJAMIN|PATRICIO/i.test(sinAcentos(x)); })) { hdr = rows[r]; hi = r; break; }
    if (!hdr) return;
    var bloques = [];
    DB.config.socios.forEach(function(s){
      var col = hdr.findIndex(function(x){ var h = sinAcentos(x).toUpperCase().trim(); return h && (h === sinAcentos(s.alias || '').toUpperCase() || sinAcentos(s.nombre).toUpperCase().split(/\s+/).indexOf(h) >= 0); });
      if (col < 0) return;
      var reaj = -1; for (var c = col + 1; c < hdr.length; c++) { if (/REAJUSTE/i.test(hdr[c])) { reaj = c; break; } if (c > col + 4) break; }
      bloques.push({ socio: s.id, nom: col, nota: col + 1, monto: col + 2, reaj: reaj });
    });
    if (!bloques.length) return;
    meses.push(p);
    bloques.forEach(function(b){
      for (var r = hi + 1; r < rows.length; r++) {
        var nomRaw = String(rows[r][b.nom] || '').trim();
        if (/TOTAL/i.test(nomRaw)) break;
        var monto = num(rows[r][b.monto]);
        if (!nomRaw || !monto) continue;
        var nom = limpiarNombre(nomRaw);
        var nota = [String(rows[r][b.nota] || '').trim(), (nomRaw.match(/\(.*$/) || [''])[0], (nomRaw.match(/\d+\/\d+\s*mes/i) || [''])[0]].filter(Boolean).join(' ');
        var d = datos[nom] = datos[nom] || { meses: {} };
        var m = d.meses[p] = d.meses[p] || { socios: {}, nota: '', reaj: '' };
        m.socios[b.socio] = (m.socios[b.socio] || 0) + monto;
        if (nota) m.nota = (m.nota ? m.nota + ' ' : '') + nota;
        if (b.reaj >= 0 && rows[r][b.reaj] && !m.reaj) m.reaj = typeof rows[r][b.reaj] === 'number' ? rows[r][b.reaj] : String(rows[r][b.reaj]).trim();
      }
    });
  });
  meses.sort();
  return { meses: meses, datos: datos };
}
function importarPlanilla(wb){
  var a = analizarPlanilla(wb), nombres = Object.keys(a.datos).sort();
  if (!a.meses.length) { alert('No encontré hojas con el formato esperado (una hoja por mes con columnas por socio).'); return; }
  var ultimo = a.meses[a.meses.length - 1];
  abrirModal('Importar planilla',
    '<p>Encontré <b>' + a.meses.length + ' meses</b> (' + perNom(a.meses[0]) + ' a ' + perNom(ultimo) + ') y <b>' + nombres.length + ' locatarios</b>.</p>' +
    '<div class="tw" style="max-height:300px;overflow:auto"><table><thead><tr><th>Locatario</th><th>Meses</th><th class="n">Último total</th><th>Reparto</th><th>Próx. reajuste</th></tr></thead><tbody>' +
    nombres.map(function(n){
      var ps = Object.keys(a.datos[n].meses).sort(), u = a.datos[n].meses[ps[ps.length - 1]], tot = sum(Object.keys(u.socios), function(k){ return u.socios[k]; });
      return '<tr><td>' + esc(n) + (ps[ps.length - 1] < ultimo ? ' <span class="tag t-mut">finalizado</span>' : '') + '</td><td>' + ps.length + '</td><td class="n">' + fmt(tot) + '</td><td class="small">' + Object.keys(u.socios).map(function(k){ return esc(nombreSocio(k)) + ' ' + Math.round(u.socios[k] / tot * 100) + '%'; }).join(' / ') + '</td><td>' + (u.reaj ? (mesDeTexto(u.reaj, ultimo) ? perNom(mesDeTexto(u.reaj, ultimo)) : esc(u.reaj)) : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="calc small" style="margin-top:10px"><b>Cómo se interpreta:</b> cuando un locatario figura en las dos columnas, el alquiler total es la suma y cada socio cobra su parte (ej. mitad y mitad). Se aplica la comisión del administrador configurada (' + pct(DB.config.comisionPct, 2) + ') y la fecha de cobro el día 10 de cada mes, cobrado por la administración. Se crea un inmueble por locatario para que después le pongas la dirección (o lo reasignes). El índice queda como <b>IPC cada 4 meses</b>: revisalo en cada contrato.</div>',
    '<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn p" id="btn-imp">Importar</button>', true);
  $('btn-imp').onclick = function(){ ejecutarImportacion(a); };
}
function ejecutarImportacion(a){
  var ultimo = a.meses[a.meses.length - 1], nI = 0, nC = 0, nP = 0;
  Object.keys(a.datos).forEach(function(nom){
    var d = a.datos[nom], ps = Object.keys(d.meses).sort(), s = slug(nom);
    var u = d.meses[ps[ps.length - 1]], totU = sum(Object.keys(u.socios), function(k){ return u.socios[k]; });
    var titulares = Object.keys(u.socios).map(function(k){ return { socioId: k, pct: r2(u.socios[k] / totU * 100) }; });
    var dif = 100 - sum(titulares, function(t){ return t.pct; }); titulares[0].pct = r2(titulares[0].pct + dif);
    var inmId = 'imp-i-' + s, ctrId = 'imp-c-' + s;
    if (!byId('inmuebles', inmId)) { guardar('inmuebles', { id: inmId, nombre: 'Inmueble de ' + titulo(nom), tipo: 'Departamento', titulares: titulares, ids: {}, costos: [], docs: [], notas: 'Creado al importar la planilla. Completá dirección, cuentas y costo.' }); nI++; }
    var c = byId('contratos', ctrId), nuevo = !c;
    if (nuevo) c = { id: ctrId, inmuebleId: inmId, locatario: { nombre: titulo(nom) }, garantes: [], indice: 'IPC', periodicidad: 4, ipcDesfase: 1, diaVencimiento: DB.config.diaVencimiento, comisionPct: '', docs: [], destino: 'Vivienda', notas: 'Importado de la planilla. Verificá índice, fechas y datos del locatario.' };
    // si el contrato ya se cargó desde el documento firmado, su fecha de inicio manda (puede ser una renovación)
    if (!c.archivoContrato) c.inicio = c.inicio && c.inicio <= ps[0] + '-01' ? c.inicio : ps[0] + '-01';
    // tramos de monto: cada vez que cambia el total, salvo meses parciales (notas con "días" o "1/2 mes")
    var montos = [], prev = null;
    ps.forEach(function(p){
      var m = d.meses[p], tot = sum(Object.keys(m.socios), function(k){ return m.socios[k]; });
      if (/d[ií]as|1\/2|mes\s*\+/i.test(m.nota) && montos.length) return;
      if (tot !== prev) { montos.push({ desde: p, monto: tot, nota: prev == null ? 'Monto según planilla' : 'Actualización según planilla' }); prev = tot; }
    });
    if (nuevo || !(c.montos || []).length) c.montos = montos;
    else if (c.archivoContrato) {
      // dentro del contrato, lo que figura en la planilla es lo que efectivamente se cobró: reemplaza o completa
      montos.forEach(function(m){ if (m.desde < per(c.inicio)) return; var ex = c.montos.filter(function(x){ return x.desde === m.desde; })[0]; if (ex) { ex.monto = m.monto; ex.nota = m.nota; } else c.montos.push(m); });
    }
    else montos.forEach(function(m){ if (!c.montos.some(function(x){ return x.desde === m.desde; }) && m.desde > montosOrd(c).slice(-1)[0].desde) c.montos.push(m); });
    var pr = u.reaj ? mesDeTexto(u.reaj, ultimo) : null;
    // sin dato de reajuste: se estima desde el último cambio de monto (si no, el calendario arrancaría en enero y daría falsos atrasos)
    if (!pr && c.periodicidad) { var ult = montosOrd(c).slice(-1)[0]; pr = perAdd(ult ? ult.desde : ps[0], c.periodicidad); while (pr <= ultimo) pr = perAdd(pr, c.periodicidad); }
    if (pr && (nuevo || !c.primerAjuste || c.primerAjuste < pr)) c.primerAjuste = pr;
    if (!c.ccDesde || c.ccDesde > ps[0]) c.ccDesde = ps[0] > per(c.inicio) ? ps[0] : per(c.inicio); // la planilla empieza en enero: lo anterior no es deuda
    if (ps[ps.length - 1] < ultimo) { c.estado = 'finalizado'; c.fechaFinReal = finDeMes(ps[ps.length - 1]); }
    else if (nuevo) c.estado = 'vigente';
    guardar('contratos', c); if (nuevo) nC++;
    ps.forEach(function(p){
      var pid = 'imp-p-' + s + '-' + p; if (byId('pagos', pid)) return;
      var m = d.meses[p], tot = sum(Object.keys(m.socios), function(k){ return m.socios[k]; });
      var fecha = p + '-10'; if (fecha > hoy()) fecha = hoy();
      var dist = Object.keys(m.socios).map(function(k){ return { socioId: k, pct: r2(m.socios[k] / tot * 100) }; });
      guardar('pagos', { id: pid, contratoId: ctrId, inmuebleId: inmId, periodo: p, fecha: fecha, alquiler: tot, punitorios: 0, descuento: 0, extras: [], medio: 'Planilla', recibio: [{ quien: 'admin', monto: tot }], comisionPct: num(DB.config.comisionPct), comision: r2(tot * num(DB.config.comisionPct) / 100), cotOf: cotiz('oficial', fecha), cotBl: cotiz('blue', fecha), distribucion: dist, reciboNro: 'PLAN-' + p, nota: m.nota || '' });
      nP++;
    });
  });
  cerrarModal(); renderTodo();
  toast('Importados: ' + nI + ' inmuebles, ' + nC + ' contratos, ' + nP + ' cobros', 5000);
}

    dueno: 'Ve solo los inmuebles donde ese socio figura en la titularidad (propios y compartidos): cobros, gastos, recibos, liquidación y rentabilidad, y su chat con la administración. No puede cargar ni modificar nada.',

function guardarUsuario(email){
  var r = val('us-rol');
  var u = { email: (email || val('us-mail')).toLowerCase().trim(), nombre: val('us-nom'), rol: r, socioId: r === 'locatario' ? '' : val('us-socio'), contratoId: r === 'locatario' ? val('us-ctr') : '' };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u.email)) { toast('Email inválido'); return; }
  if (u.rol === 'dueno' && !u.socioId) { toast('Elegí de qué socio es dueño'); return; }
  if (u.rol === 'locatario' && !u.contratoId) { toast('Elegí el contrato del locatario'); return; }
  if (u.email === SUPERADMIN && u.rol !== 'admin') { toast('Esta cuenta es siempre administradora'); return; }
  var p = conFirebase() ? fsPutUsuario(u) : Promise.resolve().then(function(){
    DB.config.usuarios = (DB.config.usuarios || []).filter(function(x){ return x.email !== u.email; }).concat([u]); guardarConfig();
  });
  p.then(function(){
    var desc = u.rol === 'admin' ? 'administrador' : u.rol === 'locatario' ? 'locatario de ' + nombreClave('loc:' + u.contratoId) : 'dueño de ' + nombreSocio(u.socioId);
    auditoriaManual(email ? 'modificación' : 'alta', 'usuarios', u.email, u.email + ' → ' + desc);
    USUARIOS_CACHE = null; cerrarModal(); toast('Usuario guardado'); pintarUsuarios();
  }).catch(function(e){ toast(e.message, 5000); });
}
function borrarUsuario(email){
  confirmar('¿Quitarle el acceso a ' + email + '?').then(function(ok){
    if (!ok) return;
    var p = conFirebase() ? fsDelUsuario(email) : Promise.resolve().then(function(){ DB.config.usuarios = (DB.config.usuarios || []).filter(function(x){ return x.email !== email; }); guardarConfig(); });
    p.then(function(){
      auditoriaManual('baja', 'usuarios', email, 'Se quitó el acceso a ' + email);
      USUARIOS_CACHE = null; cerrarModal(); pintarUsuarios();
    });
  });
}

}

// ═══════════════════════════════════════════
// Importación de contratos (archivo .json armado a partir de los contratos firmados)
// Se combina con la planilla: los locatarios que están en la planilla usan los mismos
// identificadores (imp-c-…), así se conserva el historial de cobros sin importar el orden.
// ═══════════════════════════════════════════
var TIPO_INM_MAP = { 'Casa': 'Casa', 'Departamento': 'Departamento', 'Dúplex': 'Dúplex', 'Local comercial': 'Local comercial', 'Terreno': 'Terreno', 'Oficina': 'Oficina', 'Cochera': 'Cochera' };

function elegirContratosJSON(){
  var fi = $('fileIn'); fi.multiple = false; fi.accept = '.json,application/json';
  fi.onchange = function(){
    var f = fi.files[0]; fi.value = ''; if (!f) return;
    f.text().then(function(t){
      var d = JSON.parse(t);
      if (d.tipo !== 'inmoflow-contratos' || !Array.isArray(d.contratos)) throw new Error('No es un archivo de contratos de InmoFlow');
      previaContratos(d);
    }).catch(function(e){ alert('No se pudo leer: ' + e.message); });
  };
  fi.click();
}
function idsDeContrato(k){
  return k.planilla ? { inm: 'imp-i-' + k.planilla, ctr: 'imp-c-' + k.planilla }
    : { inm: 'ctr-i-' + slug(k.inmueble.direccion), ctr: 'ctr-c-' + slug(k.locatario.nombre) };
}
function previaContratos(d){
  var nuevosSocios = (d.socios || []).filter(function(s){ return !DB.config.socios.some(function(x){ return x.id === s.id; }); });
  var filas = d.contratos.map(function(k){
    var ids = idsDeContrato(k), existe = !!byId('contratos', ids.ctr);
    return '<tr><td><b>' + esc(k.locatario.nombre) + '</b><div class="small muted">' + esc(k.inmueble.nombre) + '</div></td><td class="small">' + k.titulares.map(function(t){ var s = DB.config.socios.concat(d.socios || []).filter(function(x){ return x.id === t.socioId; })[0]; return esc(s ? s.nombre : t.socioId) + (t.pct < 100 ? ' ' + t.pct + '%' : ''); }).join(' / ') + '</td>' +
      '<td class="small">' + fDate(k.inicio) + ' → ' + fDate(k.fin) + '</td><td class="n">' + fmt(k.monto) + '</td><td class="small">' + esc(k.indice) + ' ' + k.periodicidad + 'm</td>' +
      '<td>' + (existe ? '<span class="tag t-info">completa existente</span>' : '<span class="tag t-ok">nuevo</span>') + (k.observaciones && k.observaciones.length ? ' <span class="tag t-warn" title="' + esc(k.observaciones.join(' · ')) + '">revisar</span>' : '') + '</td></tr>';
  }).join('');
  abrirModal('Importar contratos vigentes',
    '<p><b>' + d.contratos.length + ' contratos</b>' + (nuevosSocios.length ? ' y <b>' + nuevosSocios.length + ' locadores nuevos</b> (' + nuevosSocios.map(function(s){ return esc(s.nombre); }).join(', ') + ')' : '') + '.</p>' +
    '<div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th>Locatario / inmueble</th><th>Dueños</th><th>Vigencia</th><th class="n">Monto inicial</th><th>Ajuste</th><th></th></tr></thead><tbody>' + filas + '</tbody></table></div>' +
    '<div class="calc small" style="margin-top:10px"><b>Cómo se combina:</b> los locatarios que ya vienen de la planilla se completan (DNI, contacto, garantes, dirección, vigencia e índice) y conservan su historial de cobros y montos. ' +
    'Los contratos nuevos arrancan su cuenta corriente en <b>' + perNom(d.ccDesdeNuevos || perHoy()) + '</b> (lo anterior no figura como deuda) y su alquiler actual se <b>estima aplicando el índice</b> desde el inicio: verificalo con lo que efectivamente se cobra. Los puntos marcados “revisar” quedan anotados en cada contrato.</div>',
    '<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn p" id="btn-impc">Importar</button>', true);
  $('btn-impc').onclick = function(){ ejecutarImportContratos(d); };
}
function ejecutarImportContratos(d){
  var n = { socios: 0, inmN: 0, inmA: 0, ctrN: 0, ctrA: 0, est: 0 };
  (d.socios || []).forEach(function(s){
    if (DB.config.socios.some(function(x){ return x.id === s.id; })) return;
    DB.config.socios.push(Object.assign({}, s)); n.socios++;
  });
  if (n.socios) guardarConfig();
  var desdeNuevos = d.ccDesdeNuevos || perHoy();
  d.contratos.forEach(function(k){
    var ids = idsDeContrato(k);
    // inmueble
    var inm = byId('inmuebles', ids.inm), nuevoInm = !inm;
    inm = nuevoInm ? { id: ids.inm, costos: [], docs: [], ids: {} } : JSON.parse(JSON.stringify(inm));
    inm.nombre = k.inmueble.nombre; inm.direccion = k.inmueble.direccion; inm.localidad = k.inmueble.localidad || 'Oncativo';
    inm.tipo = TIPO_INM_MAP[k.inmueble.tipo] || 'Otro';
    inm.titulares = k.titulares.map(function(t){ return { socioId: t.socioId, pct: t.pct }; });
    inm.ids = inm.ids || {}; if (k.inmueble.rentas) inm.ids.rentas = k.inmueble.rentas;
    if (k.inmueble.descripcion && (!inm.notas || /Creado al importar la planilla/.test(inm.notas))) inm.notas = k.inmueble.descripcion;
    guardar('inmuebles', inm); nuevoInm ? n.inmN++ : n.inmA++;
    // contrato
    var c = byId('contratos', ids.ctr), nuevoC = !c;
    c = nuevoC ? { id: ids.ctr, docs: [], comisionPct: '', diaVencimiento: DB.config.diaVencimiento } : JSON.parse(JSON.stringify(c));
    c.inmuebleId = ids.inm; c.locatario = Object.assign({}, k.locatario); c.colocatarios = k.colocatarios || [];
    c.garantes = k.garantes || []; c.inicio = k.inicio; c.fin = k.fin; c.indice = k.indice; c.periodicidad = k.periodicidad;
    c.destino = k.destino || 'Vivienda'; c.locadorFormal = k.locadorFormal || ''; c.observaciones = k.observaciones || []; c.archivoContrato = k.archivo;
    if (c.fin >= hoy()) { c.estado = 'vigente'; delete c.fechaFinReal; }
    c.notas = c.notas && !/Importado de la planilla/.test(c.notas) ? c.notas : 'Datos cargados del contrato "' + k.archivo + '".';
    var inicioP = per(k.inicio), ms = montosOrd(c);
    if (!ms.length) ms = [{ desde: inicioP, monto: k.monto, nota: 'Monto inicial según contrato' }];
    else if (ms[0].desde > inicioP) ms.unshift({ desde: inicioP, monto: k.monto, nota: 'Monto inicial según contrato' });
    c.montos = ms;
    if (k.planilla) c.ccDesde = c.ccDesde || (inicioP > '2026-01' ? inicioP : '2026-01');
    else {
      c.ccDesde = c.ccDesde || (inicioP > desdeNuevos ? inicioP : desdeNuevos);
      // alquiler actual estimado: se aplica el índice en cada ajuste ya vencido
      if (nuevoC && ['ICL', 'IPC', 'UVA'].indexOf(k.indice) >= 0) {
        calendarioAjustes(c).filter(function(p){ return p <= perHoy(); }).forEach(function(p){
          if (c.montos.some(function(m){ return m.desde === p; })) return;
          var a = calcularAjuste(c, p);
          if (a.coef > 1) { c.montos.push({ desde: p, monto: a.monto, nota: 'Estimado con ' + k.indice + ' al importar (' + pct((a.coef - 1) * 100, 1) + ') — verificar' }); n.est++; }
        });
      } else if (nuevoC) {
        // sin índice publicado para estimar (Casa Propia / manual): el próximo ajuste es el siguiente a hoy
        var prox = calendarioAjustes(c).filter(function(p){ return p > perHoy(); })[0];
        c.primerAjuste = prox || perAdd(per(k.fin), 1);
      }
    }
    guardar('contratos', c); nuevoC ? n.ctrN++ : n.ctrA++;
  });
  cerrarModal(); renderTodo();
  toast('Listo: ' + n.ctrN + ' contratos nuevos, ' + n.ctrA + ' completados, ' + n.inmN + ' inmuebles nuevos, ' + n.socios + ' locadores nuevos', 6000);
  return n;
}

// ─── adjuntar en lote los archivos de los contratos firmados ───
// Se eligen todos los .docx/.pdf juntos; cada uno se asocia a su contrato por el nombre del archivo.
function normArchivo(n){ return sinAcentos(String(n || '')).toLowerCase().replace(/\.(docx?|pdf)$/i, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function elegirArchivosContratos(){
  var fi = $('fileIn'); fi.multiple = true; fi.accept = '.doc,.docx,.pdf';
  fi.onchange = function(){
    var files = Array.prototype.slice.call(fi.files); fi.value = ''; if (!files.length) return;
    var ctrs = vivos('contratos').filter(function(c){ return c.archivoContrato; });
    var asign = [], sin = [];
    files.forEach(function(f){
      var c = ctrs.filter(function(x){ return normArchivo(x.archivoContrato) === normArchivo(f.name); })[0];
      if (!c) { sin.push(f.name); return; }
      if ((c.docs || []).some(function(d){ return normArchivo(d.nombre) === normArchivo(f.name); })) { sin.push(f.name + ' (ya estaba adjunto)'); return; }
      asign.push({ c: c, f: f });
    });
    abrirModal('Adjuntar contratos firmados',
      '<p><b>' + asign.length + '</b> archivo(s) se van a adjuntar a su contrato' + (AUTH_TOKEN || conFirebase() ? ' y guardar en Google Drive (carpeta InmoFlow), compartidos solo-lectura con el dueño si tiene usuario.' : ' (sin Google: quedan solo en este dispositivo).') + '</p>' +
      (asign.length ? '<div class="tw" style="max-height:240px;overflow:auto"><table><tbody>' + asign.map(function(a){ return '<tr><td class="small">' + esc(a.f.name) + '</td><td class="small">→ ' + esc(etiquetaContrato(a.c)) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
      (sin.length ? '<div class="hint" style="margin-top:8px">No se adjuntan: ' + sin.map(esc).join(', ') + '</div>' : '') +
      '<div class="hint" id="adj-prog" style="margin-top:8px"></div>',
      '<button class="btn" onclick="cerrarModal()">Cancelar</button>' + (asign.length ? '<button class="btn p" id="btn-adj">Adjuntar ' + asign.length + '</button>' : ''));
    if (asign.length) $('btn-adj').onclick = function(){
      var go = function(){
        $('btn-adj').disabled = true; var ok = 0;
        asign.reduce(function(acc, a, k){
          return acc.then(function(){
            $('adj-prog').textContent = 'Subiendo ' + (k + 1) + ' de ' + asign.length + ': ' + a.f.name;
            return subirArchivos('contratos', a.c.id, [a.f], 'Contrato', { silencioso: true }).then(function(r){ if (r) ok++; });
          });
        }, Promise.resolve()).then(function(){ cerrarModal(); renderTodo(); toast(ok + ' de ' + asign.length + ' contratos adjuntados', 5000); });
      };
      if (conFirebase() && !AUTH_TOKEN && !tokenGuardado()) conDrive(go); else go();
    };
  };
  fi.click();
}
// ═══════════════════════════════════════════
// MENSAJES: chat privado de cada locatario y cada dueño con la administración.
// Cada persona tiene su propia conversación (hilo 'h:<clave>'): la ve ella y los administradores.
// Nadie más puede leerla (lo controla el servidor, ver firestore.rules).
// Firestore por REST no avisa en tiempo real: se consulta cada 20 segundos mientras la app está abierta.
// ═══════════════════════════════════════════
var CHAT = { hilo: null, ultimo: 0, timer: null, leidos: null, primera: true };
function hiloDe(clave){ return 'h:' + clave; }
function claveDeHilo(h){ return String(h || '').slice(2); }
function miHilo(){ return hiloDe(claveUsuario()); }
function leidos(){ if (!CHAT.leidos) { try { CHAT.leidos = JSON.parse(localStorage.getItem('inmoflow_leidos') || '{}'); } catch (e) { CHAT.leidos = {}; } } return CHAT.leidos; }
function marcarLeido(h){ var l = leidos(), u = ultimoDeHilo(h); if (u) { l[h] = u.updatedAt; try { localStorage.setItem('inmoflow_leidos', JSON.stringify(l)); } catch (e) {} } }
function mensajesDe(h){ return (DB.mensajes || []).filter(function(m){ return m.hilo === h; }).sort(function(a, b){ return a.updatedAt - b.updatedAt; }); }
function ultimoDeHilo(h){ var ms = mensajesDe(h); return ms[ms.length - 1]; }
function esMio(m){ return m.autorEmail === emailYo(); }
function noLeidos(h){ var t = leidos()[h] || 0; return mensajesDe(h).filter(function(m){ return !esMio(m) && m.updatedAt > t && (esAdmin() ? m.autorRol !== 'admin' : m.autorRol === 'admin'); }).length; }
function totalNoLeidos(){
  if (esAdmin()) { var hs = {}; (DB.mensajes || []).forEach(function(m){ hs[m.hilo] = 1; }); return sum(Object.keys(hs), noLeidos); }
  return claveUsuario() ? noLeidos(miHilo()) : 0;
}

// ─── traer y enviar ──────────────────────────
function chatTraer(){
  if (!conFirebase() || !conectado() || SIMULAR) return Promise.resolve();
  var q = esAdmin()
    ? fsRunQuery('mensajes', { field: { fieldPath: 'updatedAt' }, op: 'GREATER_THAN', value: { integerValue: String(CHAT.ultimo) } })
    : (claveUsuario() ? fsRunQuery('mensajes', { field: { fieldPath: 'hilo' }, op: 'EQUAL', value: { stringValue: miHilo() } }) : Promise.resolve([]));
  return q.then(function(arr){
    var nuevos = [];
    DB.mensajes = DB.mensajes || [];
    arr.forEach(function(m){
      if (DB.mensajes.some(function(x){ return x.id === m.id; })) return;
      DB.mensajes.push(m); if (!esMio(m)) nuevos.push(m);
      if (m.updatedAt > CHAT.ultimo) CHAT.ultimo = m.updatedAt;
    });
    // reintenta los que no se pudieron enviar
    DB.mensajes.filter(function(m){ return m.pendiente; }).forEach(enviarAlServidor);
    if (nuevos.length) {
      guardarLocal();
      if (!CHAT.primera) avisarNuevos(nuevos);
      if (PAGINA === 'mensajes') renderMensajes(); else renderTabs();
    }
    CHAT.primera = false;
  }).catch(function(e){ console.warn('chat', e); });
}
function iniciarChat(){
  clearInterval(CHAT.timer);
  CHAT.ultimo = (DB.mensajes || []).reduce(function(a, m){ return Math.max(a, m.updatedAt || 0); }, 0);
  CHAT.timer = setInterval(chatTraer, 20000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) chatTraer(); });
}
function avisarNuevos(ms){
  var de = ms.filter(function(m){ return esAdmin() ? m.autorRol !== 'admin' : m.autorRol === 'admin'; });
  if (!de.length) return;
  var m = de[de.length - 1], quien = esAdmin() ? nombreClave(claveDeHilo(m.hilo)) : (m.autorNombre || 'Administración');
  if (!(PAGINA === 'mensajes' && !document.hidden && (!esAdmin() || CHAT.hilo === m.hilo))) toast('Mensaje nuevo de ' + quien, 4000);
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification('InmoFlow · ' + quien, { body: m.texto.slice(0, 120), icon: 'icon-192.png' }); } catch (e) {}
  }
}
function enviarAlServidor(m){
  if (!conFirebase() || !conectado()) return Promise.resolve();
  var limpio = Object.assign({}, m); delete limpio.pendiente;
  return fsPut('mensajes', limpio).then(function(){ m.pendiente = false; guardarLocal(); if (PAGINA === 'mensajes') renderMensajes(); })
    .catch(function(e){ console.warn('enviar', e); });
}
function chatEnviar(){
  if (SIMULAR) { toast('Estás viendo la app como otra persona: no se puede enviar'); return; }
  var ta = $('chat-txt'); if (!ta) return;
  var texto = ta.value.trim(); if (!texto) return;
  var h = esAdmin() ? CHAT.hilo : miHilo(); if (!h || h === 'h:') { toast('Elegí una conversación'); return; }
  var m = { id: uid(), hilo: h, texto: texto.slice(0, 4000), fecha: new Date().toISOString(), updatedAt: Date.now(),
    autorEmail: emailYo(), autorNombre: quienSoy(), autorRol: esAdmin() ? 'admin' : (esLocatario() ? 'locatario' : 'dueno'), pendiente: true };
  DB.mensajes = (DB.mensajes || []).concat([m]); guardarLocal();
  ta.value = ''; renderMensajes();
  if (conFirebase()) enviarAlServidor(m); else { m.pendiente = false; guardarLocal(); renderMensajes(); }
}

// ─── pantalla ────────────────────────────────
function etiquetaHilo(h){
  var k = claveDeHilo(h), loc = k.indexOf('loc:') === 0, c = loc ? byId('contratos', k.slice(4)) : null;
  return { nombre: nombreClave(k), rol: loc ? 'Locatario' : 'Dueño', sub: loc && c ? nombreInm(c.inmuebleId) : '' };
}
function horaMsj(m){ var d = new Date(m.fecha); return (fDate(m.fecha.slice(0, 10)) === fDate(hoy()) ? '' : fDate(m.fecha.slice(0, 10)) + ' ') + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function htmlHilo(h, titulo, subtitulo){
  var ms = mensajesDe(h);
  setTimeout(function(){ marcarLeido(h); renderTabs(); var b = $('chat-msgs'); if (b) b.scrollTop = b.scrollHeight; }, 0);
  return '<div class="chat-box"><div class="chat-h">' + (esAdmin() ? '<button class="btn sm ghost chat-back" onclick="CHAT.hilo=null;renderMensajes()" aria-label="Volver">‹</button>' : '') +
    '<div><b>' + esc(titulo) + '</b><div class="small muted">' + esc(subtitulo) + '</div></div></div>' +
    '<div class="chat-msgs" id="chat-msgs">' + (ms.length ? ms.map(function(m){
      var mio = esAdmin() ? m.autorRol === 'admin' : esMio(m);
      return '<div class="msg ' + (mio ? 'yo' : 'otro') + '"><div class="burb">' + (mio && !esAdmin() ? '' : '<div class="autor">' + esc(m.autorRol === 'admin' ? (m.autorNombre || 'Administración') : m.autorNombre) + '</div>') +
        esc(m.texto).replace(/\n/g, '<br>') + '<div class="hora">' + horaMsj(m) + (m.pendiente ? ' · enviando…' : '') + '</div></div></div>';
    }).join('') : '<div class="empty">Todavía no hay mensajes. Escribí el primero.</div>') + '</div>' +
    '<div class="chat-in"><textarea class="f" id="chat-txt" rows="2" placeholder="Escribí un mensaje…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();chatEnviar()}"></textarea><button class="btn p" onclick="chatEnviar()">Enviar</button></div></div>';
}
function renderMensajes(){
  var el = $('p-mensajes'); if (!el) return;
  var txt = $('chat-txt') ? $('chat-txt').value : '';
  if (!esAdmin()) {
    var k = claveUsuario();
    el.innerHTML = '<h2>Mensajes</h2><p class="sub">Tu conversación con la administración. La leen solamente vos y los administradores.</p>' +
      (k ? htmlHilo(hiloDe(k), DB.config.administrador ? 'Administración · ' + DB.config.administrador : 'Administración', 'Consultas, reclamos, comprobantes de pago') : '<div class="card empty">Tu usuario no tiene una cuenta asociada todavía.</div>');
  } else {
    var hs = {}; (DB.mensajes || []).forEach(function(m){ hs[m.hilo] = 1; });
    if (CHAT.hilo) hs[CHAT.hilo] = 1;
    var lista = Object.keys(hs).map(function(h){ var u = ultimoDeHilo(h); return { h: h, u: u, n: noLeidos(h), e: etiquetaHilo(h) }; })
      .sort(function(a, b){ return ((b.u && b.u.updatedAt) || 0) - ((a.u && a.u.updatedAt) || 0); });
    var col = '<div class="chat-list"><div class="card-h" style="padding:10px 12px"><b>Conversaciones</b><button class="btn sm p" onclick="nuevaConversacion()">+ Nueva</button></div>' +
      (lista.length ? lista.map(function(x){
        return '<button class="chat-item' + (CHAT.hilo === x.h ? ' on' : '') + '" onclick="CHAT.hilo=\'' + x.h + '\';renderMensajes()"><span class="av">' + esc(iniciales(x.e.nombre)) + '</span><span class="ci-t"><b>' + esc(x.e.nombre) + '</b>' +
          '<span class="small muted">' + esc(x.e.rol) + (x.e.sub ? ' · ' + esc(x.e.sub) : '') + '</span><span class="small ci-u">' + (x.u ? esc((x.u.autorRol === 'admin' ? 'Vos: ' : '') + x.u.texto.slice(0, 60)) : 'sin mensajes') + '</span></span>' +
          (x.n ? '<span class="cnt">' + x.n + '</span>' : '') + '</button>';
      }).join('') : '<div class="empty small">Todavía no hay conversaciones.</div>') + '</div>';
    var e = CHAT.hilo ? etiquetaHilo(CHAT.hilo) : null;
    el.innerHTML = '<h2>Mensajes</h2><p class="sub">Cada locatario y cada dueño tiene su conversación privada con la administración. Solo los administradores ven todas.</p>' +
      '<div class="chat-wrap' + (CHAT.hilo ? ' abierto' : '') + '">' + col +
      (CHAT.hilo ? htmlHilo(CHAT.hilo, e.nombre, e.rol + (e.sub ? ' · ' + e.sub : '') + ' · conversación privada') : '<div class="chat-box chat-vacio"><div class="empty">Elegí una conversación o empezá una nueva.</div></div>') + '</div>';
  }
  if (txt && $('chat-txt')) $('chat-txt').value = txt;
}
function nuevaConversacion(){
  var socios = DB.config.socios.map(function(s){ return [s.id, 'Dueño · ' + s.nombre]; });
  var locs = vivos('contratos').filter(function(c){ return estadoContrato(c) === 'vigente'; }).sort(function(a, b){ return a.locatario.nombre.localeCompare(b.locatario.nombre); })
    .map(function(c){ return ['loc:' + c.id, 'Locatario · ' + c.locatario.nombre + ' (' + nombreInm(c.inmuebleId) + ')']; });
  abrirModal('Nueva conversación', sel('nc-k', 'Con', locs.concat(socios), '') + '<div class="hint" style="margin-top:8px">Para que la persona lea y responda desde su celular, tiene que tener usuario (Ajustes → Usuarios y permisos).</div>',
    '<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn p" onclick="CHAT.hilo=hiloDe(val(\'nc-k\'));cerrarModal();renderMensajes()">Abrir</button>');
}
// ═══════════════════════════════════════════
// Vista del LOCATARIO: su alquiler, su cuenta, sus recibos y su contrato. Nada más.
// (El servidor solo le entrega su contrato y sus cobros; ver firestore.rules.)
// ═══════════════════════════════════════════
function inmDeContrato(c){
  var i = byId('inmuebles', c.inmuebleId);
  return i ? { nombre: i.nombre, direccion: i.direccion || '', localidad: i.localidad || '' } : (c._inm || { nombre: '', direccion: '', localidad: '' });
}
function renderMiAlquiler(){
  var cid = contratoDelUsuario(), c = cid ? byId('contratos', cid) : null;
  if (!c) {
    $('p-mialquiler').innerHTML = '<h2>Mi alquiler</h2><div class="card empty">Todavía no aparecen los datos de tu contrato.<br>Si recién te dieron acceso, tocá el indicador de arriba a la derecha para actualizar, o escribile a la administración.<br><button class="btn p" style="margin-top:10px" onclick="ir(\'mensajes\')">Escribir a la administración</button></div>';
    return;
  }
  var ph = perHoy(), inm = inmDeContrato(c), cc = cuentaCorriente(c);
  var f = cc.filas.filter(function(x){ return x.periodo === ph; })[0];
  var deuda = sum(deudaContrato(c), function(x){ return x.debe - x.pagado; }), pa = proximoAjuste(c);
  var dv = c.diaVencimiento || DB.config.diaVencimiento || 10, cfg = DB.config;
  var h = '<h2>Mi alquiler</h2><p class="sub">' + esc([inm.direccion || inm.nombre, inm.localidad].filter(Boolean).join(', ')) + '</p>' +
    '<div class="kpis">' +
      kpi('Alquiler de ' + perNom(ph).split(' ')[0].toLowerCase(), fmt(montoVigente(c, ph)), f ? tagEstado(f.estado) : '') +
      kpi('Se paga', 'del 1 al ' + dv, 'de cada mes, por adelantado') +
      kpi('Saldo', deuda > 0 ? '<span class="neg-v">' + fmt(deuda) + '</span>' : 'Al día', deuda > 0 ? deudaContrato(c).map(function(x){ return perNom(x.periodo); }).join(', ') : 'sin deuda') +
      kpi('Próxima actualización', pa ? perNom(pa) : '—', pa ? 'según ' + esc((INDICES[c.indice] || c.indice).replace(/ —.*$/, '')) : '') +
    '</div>' +
    '<div class="grid g2">' +
      '<div class="card"><h3>Cómo pagar</h3>' +
        (cfg.datosPago ? '<div style="white-space:pre-wrap" class="b">' + esc(cfg.datosPago) + '</div>' : '<div class="hint">Consultá a la administración los datos para transferir.</div>') +
        '<p class="small muted" style="margin-bottom:0">Después de transferir, mandá el comprobante por el chat: así se registra el pago y te llega el recibo.</p>' +
        '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="ir(\'mensajes\')">Escribir a la administración</button></div></div>' +
      '<div class="card"><h3>Mi contrato</h3><div class="kv">' +
        '<div>Inmueble</div><div>' + esc(inm.direccion || inm.nombre) + '</div>' +
        '<div>Vigencia</div><div>' + fDate(c.inicio) + ' al ' + fDate(c.fin) + '</div>' +
        '<div>Actualización</div><div>' + esc((INDICES[c.indice] || c.indice).replace(/ —.*$/, '')) + (c.periodicidad ? ', cada ' + c.periodicidad + ' meses' : '') + '</div>' +
        '<div>Locatario</div><div>' + esc(c.locatario.nombre) + (c.colocatarios && c.colocatarios.length ? ' y ' + c.colocatarios.map(function(x){ return esc(x.nombre); }).join(', ') : '') + '</div>' +
        '<div>Garantes</div><div>' + ((c.garantes || []).map(function(g){ return esc(g.nombre); }).join('<br>') || '—') + '</div>' +
        '<div>Administra</div><div>' + esc(cfg.administrador || '') + '</div>' +
      '</div>' +
      ((c.docs || []).length ? '<div class="liq-sec">Documentos</div>' + c.docs.map(function(d, k){ return '<div class="row"><span>' + esc(d.nombre) + '</span><span><a href="#" onclick="abrirDoc(\'contratos\',\'' + c.id + '\',' + k + ');return false">abrir</a></span></div>'; }).join('') : '') +
      '</div>' +
    '</div>' +
    '<h3 style="margin-top:18px">Mis pagos y recibos</h3>' +
    '<div class="tw"><table><thead><tr><th>Mes</th><th class="n">Alquiler</th><th class="n">Pagado</th><th>Estado</th><th>Recibo</th></tr></thead><tbody>' +
      cc.filas.slice().reverse().map(function(x){
        return '<tr><td><b>' + perNom(x.periodo) + '</b></td><td class="n">' + fmt(x.debe) + '</td><td class="n">' + fmt(x.pagado) + '</td><td>' + tagEstado(x.estado) + '</td>' +
          '<td>' + x.pagos.map(function(p){ return '<button class="btn sm" onclick="verRecibo(\'' + p.id + '\')">' + (/^PLAN/.test(p.reciboNro || '') ? 'Ver' : 'N° ' + esc(p.reciboNro || '')) + '</button>'; }).join(' ') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  $('p-mialquiler').innerHTML = h;
}
</script>
</body>
