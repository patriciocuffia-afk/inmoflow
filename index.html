<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InmoFlow</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#14212b; --muted:#64748b; --line:#e2e8f0;
  --pri:#0f766e; --pri-2:#115e59; --pri-soft:#ccfbf1;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --info:#1d4ed8; --info-soft:#dbeafe;
  --blue:#6d28d9; --blue-soft:#ede9fe;
  --r:12px; --sh:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1218; --card:#121c24; --ink:#e2e8f0; --muted:#94a3b8; --line:#23313d;
    --pri:#2dd4bf; --pri-2:#5eead4; --pri-soft:#123c38;
    --ok:#4ade80; --ok-soft:#12321f; --warn:#fbbf24; --warn-soft:#3a2c0b;
    --bad:#f87171; --bad-soft:#3b1414; --info:#93c5fd; --info-soft:#14284a;
    --blue:#c4b5fd; --blue-soft:#271d47;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1218; --card:#121c24; --ink:#e2e8f0; --muted:#94a3b8; --line:#23313d;
  --pri:#2dd4bf; --pri-2:#5eead4; --pri-soft:#123c38;
  --ok:#4ade80; --ok-soft:#12321f; --warn:#fbbf24; --warn-soft:#3a2c0b;
  --bad:#f87171; --bad-soft:#3b1414; --info:#93c5fd; --info-soft:#14284a;
  --blue:#c4b5fd; --blue-soft:#271d47;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hdr{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1280px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo b{color:var(--pri)}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--pri);display:grid;place-items:center;color:#fff;font-size:15px}
.hdr-sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;border:1px solid var(--line);padding:4px 10px;border-radius:99px;background:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.dot.on{background:#16a34a}.dot.busy{background:#f59e0b}.dot.err{background:#dc2626}
.vista{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1280px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer;position:relative}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.tab .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:16px}
.page{display:none}.page.on{display:block}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
h3{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1;min-width:160px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.card+.card{margin-top:12px}
.grid>.card+.card{margin-top:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme="dark"] .btn.p{color:#04201d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.p{color:#04201d}}
.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);min-width:0}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
textarea.f{resize:vertical;min-height:70px}
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:10px}
.fsec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--pri);margin:16px 0 8px;padding-top:10px;border-top:1px dashed var(--line)}
.fsec:first-child{border-top:0;padding-top:0;margin-top:0}
.hint{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--bg);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
tfoot td{font-weight:800;background:var(--bg)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--info-soft);color:var(--info)}
.t-blue{background:var(--blue-soft);color:var(--blue)}.t-mut{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.usd-o{color:var(--info)}.usd-b{color:var(--blue)}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.alert .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.alert.warn .ic{background:var(--warn-soft);color:var(--warn)}
.alert.bad .ic{background:var(--bad-soft);color:var(--bad)}
.alert.info .ic{background:var(--info-soft);color:var(--info)}
.alert.ok .ic{background:var(--ok-soft);color:var(--ok)}
.alert .tx{flex:1;min-width:0}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap}
.pcard{cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--pri)}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard .nm{font-weight:800;font-size:15px}
.meter{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--pri)}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
.row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.subtabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:600;font-size:12px;cursor:pointer}
.subtabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.back{margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.mbg.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:980px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh h3{margin:0}
.mb{padding:16px;max-height:72vh;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.calc{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.lines .ln{display:grid;grid-template-columns:1fr 140px 32px;gap:6px;margin-bottom:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-weight:600;display:none;max-width:90vw}
.upd{display:none;background:var(--pri);color:#fff;text-align:center;padding:8px;font-weight:700;cursor:pointer}
.docs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.doc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);font-size:12px}
.doc .th{height:100px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:18px;cursor:pointer;background-size:cover;background-position:center}
.doc .ds{padding:6px 8px}
.doc .ds div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart .bar2{width:100%;max-width:34px;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
.chart .lb{font-size:10px;color:var(--muted);white-space:nowrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.copy{cursor:pointer;border-bottom:1px dotted var(--muted)}
/* ── gráficos ── roles de color de la paleta de referencia (validada para daltonismo) */
:root{--s1:#2a78d6;--s2:#eb6834;--st-good:#0ca30c;--st-warn:#fab219;--st-serious:#ec835a;--st-crit:#d03b3b;--v-grid:#e1e0d9;--v-base:#c3c2b7;--v-muted:#898781;--v-surface:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--v-grid:#2c2c2a;--v-base:#383835;--v-surface:#121c24}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--v-grid:#2c2c2a;--v-base:#383835;--v-surface:#121c24}
.viz{width:100%;min-height:60px;position:relative}
.viz svg{display:block;overflow:visible;font-family:inherit}
.v-grid{stroke:var(--v-grid);stroke-width:1}
.v-base{stroke:var(--v-base);stroke-width:1}
.v-meta{stroke:var(--ink);stroke-width:1;opacity:.55}
.v-proy{stroke:var(--s1);stroke-width:2;stroke-dasharray:4 4;opacity:.6}
.v-cross{stroke:var(--v-muted);stroke-width:1}
.v-tick{fill:var(--v-muted);font-size:11px;font-variant-numeric:tabular-nums}
.v-lab{fill:var(--muted);font-size:12px}
.v-val{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.v-bar{transition:opacity .12s}
.v-bar.on{opacity:1}
.v-hl{fill:var(--ink);opacity:.05}
.v-dot{stroke:var(--v-surface);stroke-width:2}
.v-dot-proy{fill:var(--v-surface);stroke:var(--s1)}
.v-rowhit:hover,.v-rowhit:focus{fill:var(--ink);fill-opacity:.04;outline:none}
.v-stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.v-seg{min-width:4px;cursor:default;transition:filter .12s}
.v-seg:hover,.v-seg:focus{filter:brightness(1.12);outline:none}
.v-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.v-li{display:inline-flex;align-items:center;gap:6px}
.v-li i{width:10px;height:10px;border-radius:3px;display:inline-block}
.v-li b{color:var(--ink);font-weight:600}
.v-key{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:-2px 0 8px;flex-wrap:wrap}
.v-key span{display:inline-flex;align-items:center;gap:6px}
.v-key i{display:inline-block;width:10px;height:10px;border-radius:3px}
.v-key i.l{height:2px;width:14px;border-radius:1px}
.vtip{position:fixed;z-index:95;display:none;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:8px 10px;font-size:12px;min-width:150px;max-width:260px}
.vtip-h{color:var(--muted);font-weight:600;margin-bottom:4px}
.vtip-r{display:flex;align-items:center;gap:7px;padding:1px 0}
.vtip-r b{font-variant-numeric:tabular-nums;font-size:13px}
.vtip-r span{color:var(--muted)}
.vtip-r i.k-l{width:12px;height:2px;border-radius:1px;flex:0 0 auto}
.vtip-r i.k-b{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg-ctl button{border:0;background:none;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg-ctl button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.card-h h3{margin:0}
/* inmuebles por dueño */
.duenos{display:flex;flex-direction:column;gap:12px}
.dueno{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.dueno.open{border-color:var(--pri)}
.dueno-h{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:0;background:none;cursor:pointer;text-align:left;flex-wrap:wrap}
.dueno-h:hover{background:var(--bg)}
.avs{display:flex}
.av{width:42px;height:42px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;border:3px solid var(--card)}
.av+.av{margin-left:-12px;background:var(--pri-2)}
.dueno-n{display:flex;flex-direction:column;flex:1;min-width:180px}
.dueno-n b{font-size:16px}
.dueno-k{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);font-size:14px;width:16px;text-align:center}
.dueno-b{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));padding:4px 18px 18px;border-top:1px solid var(--line);padding-top:16px;background:var(--bg)}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--pri);transform:translateY(-1px)}
.tile-t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tile-r{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:4px}
.tile-add{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;font-weight:600}
.tile-add span{font-size:22px;line-height:1}
@media (max-width:640px){.dueno-k{display:none}.dueno-h{padding:14px}}
/* liquidación tipo planilla */
.liq-col h3{display:flex;justify-content:space-between;align-items:center}
.liq-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 4px}
.liq-tot{display:flex;justify-content:space-between;font-weight:800;padding:8px 0;border-top:1px solid var(--line);margin-top:4px;font-variant-numeric:tabular-nums}
.liq-final{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:17px;padding:12px;border-radius:10px;margin-top:12px;background:var(--pri-soft);font-variant-numeric:tabular-nums}
.liq-final.neg{background:var(--bad-soft)}
.neg-v{color:var(--bad)}
.recep{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);font-size:12px;max-width:170px}
.recibo-prev{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
/* chat */
.chat-wrap{display:grid;grid-template-columns:300px 1fr;gap:12px;min-height:60vh}
.chat-list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:72vh}
.chat-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer}
.chat-item:hover{background:var(--bg)}.chat-item.on{background:var(--pri-soft)}
.chat-item .av{width:34px;height:34px;font-size:12px;border-width:0;flex:0 0 auto}
.ci-t{display:flex;flex-direction:column;flex:1;min-width:0}
.ci-u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.chat-item .cnt,.tab .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700}
.chat-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;height:72vh;min-height:380px}
.chat-vacio{justify-content:center}
.chat-h{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.chat-back{display:none}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{display:flex}.msg.yo{justify-content:flex-end}
.burb{max-width:78%;padding:8px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.4;word-wrap:break-word}
.msg.yo .burb{background:var(--pri);color:#fff;border-color:var(--pri);border-bottom-right-radius:4px}
.msg.otro .burb{border-bottom-left-radius:4px}
.burb .autor{font-size:11px;font-weight:700;color:var(--pri);margin-bottom:2px}
.msg.yo .burb .autor{color:inherit;opacity:.85}
.burb .hora{font-size:10px;opacity:.7;text-align:right;margin-top:3px}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-in textarea{min-height:44px;max-height:140px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.yo .burb{color:#04201d}}
:root[data-theme="dark"] .msg.yo .burb{color:#04201d}
@media (max-width:760px){
  .chat-wrap{grid-template-columns:1fr}
  .chat-wrap.abierto .chat-list{display:none}
  .chat-wrap:not(.abierto) .chat-box{display:none}
  .chat-back{display:inline-flex}
  .chat-box{height:calc(100vh - 210px)}
}
/* sesión y roles */

<script>
// ═══════════════════════════════════════════
// InmoFlow — núcleo: utilidades, base de datos local y sincronización
// ═══════════════════════════════════════════
var APP_VERSION = '2026-10-26-1';
var OAUTH_CLIENT_ID = '485000953207-g3r6kjptl4dvoc8p0u1aj20nket5mdrm.apps.googleusercontent.com';
var PROJECT_ID = 'costo-de-obras';
var FS_BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents';
var SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/datastore';
var COLS = ['inmuebles', 'contratos', 'pagos', 'gastos', 'comunicaciones', 'movimientos'];
var LS_DB = 'inmoflow_db', LS_COT = 'inmoflow_cotiz', LS_IDX = 'inmoflow_indices';

var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ─── utilidades ─────────────────────────────
function $(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ if (typeof v === 'number') return isFinite(v) ? v : 0; if (v == null || v === '') return 0; var s = String(v).trim().replace(/\$|\s/g, ''); if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); var n = parseFloat(s); return isFinite(n) ? n : 0; }
function r2(n){ return Math.round(n * 100) / 100; }
function fmt(n){ return '$ ' + (Math.round(num(n))).toLocaleString('es-AR'); }
function fmt2(n){ return '$ ' + num(n).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtU(n){ return 'US$ ' + num(n).toLocaleString('es-AR', {maximumFractionDigits:0}); }
function fmtU2(n){ return 'US$ ' + num(n).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function pct(n, d){ return (num(n)).toLocaleString('es-AR', {maximumFractionDigits: d == null ? 1 : d}) + '%'; }
function hoy(){ var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function p2(n){ return (n < 10 ? '0' : '') + n; }
function per(fecha){ return String(fecha || hoy()).slice(0, 7); }               // 'YYYY-MM'
function perHoy(){ return per(hoy()); }
function perAdd(p, n){ var y = +p.slice(0, 4), m = +p.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + p2(m + 1); }
function perDiff(a, b){ return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); } // meses de a hasta b
function perNom(p){ if (!p) return ''; return MESES[+p.slice(5, 7) - 1] + ' ' + p.slice(0, 4); }
function perCorto(p){ return MESES[+p.slice(5, 7) - 1].slice(0, 3) + ' ' + p.slice(2, 4); }
function fDate(f){ if (!f) return ''; var a = f.split('-'); return a[2] + '/' + a[1] + '/' + a[0]; }
function diasEntre(a, b){ return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5); }
function addDias(f, n){ var d = new Date(f + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function finDeMes(p){ var d = new Date(+p.slice(0, 4), +p.slice(5, 7), 0); return p + '-' + p2(d.getDate()); }
function toast(msg, ms){ var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display = 'none'; }, ms || 2600); }
function sum(arr, f){ var s = 0; for (var i = 0; i < arr.length; i++) s += num(f ? f(arr[i]) : arr[i]); return s; }
function byId(col, id){ return DB[col].find(function(x){ return x.id === id && !x.deleted; }) || null; }
function vivos(col){ return DB[col].filter(function(x){ return !x.deleted; }); }
function copiar(txt){ (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){ toast('Copiado: ' + txt); }, function(){ prompt('Copiá el texto:', txt); }); }

// ─── base de datos local ────────────────────
var DB = { inmuebles: [], contratos: [], pagos: [], gastos: [], comunicaciones: [], movimientos: [], config: null };
var PENDIENTES = {}; // 'col/id' → true (cambios a subir a la nube)
var SNAP = {};       // 'col/id' → JSON de la última versión guardada (para la auditoría)
function rehacerSnap(){ SNAP = {}; COLS.forEach(function(c){ DB[c].forEach(function(o){ SNAP[c + '/' + o.id] = JSON.stringify(o); }); }); }

function configBase(){
  return {
    id: 'config',
    socios: [{ id: 'patricio', nombre: 'Cuffia Patricio', alias: 'PATRICIO' }, { id: 'benjamin', nombre: 'Cuffia Benjamín', alias: 'BENJAMIN' }],
    administrador: 'Antonella',
    emisor: 'Dr. Patricio Cuffia',
    emisorDatos: 'Río Segundo, Córdoba',
    comisionPct: 5,
    comisionBase: 'alquiler',     // 'alquiler' | 'total'
    punitorioDiarioPct: 0.1,
    diaVencimiento: 10,
    reciboPuntoVenta: '0001',
    reciboNro: 1,
    avisoAjusteDias: 30,
    avisoVencimientoDias: 60,
    datosPago: '',          // alias o CBU para transferir (lo ven los locatarios)
    telAdministracion: '',
    categoriasGasto: ['Arreglos', 'Pintura', 'Electricidad', 'Plomería', 'Gas', 'Albañilería', 'Impuesto Rentas', 'Tasa municipal', 'Expensas', 'Seguro', 'Servicios', 'Honorarios', 'Mejora / inversión', 'Otros'],
    plantillas: null,
    updatedAt: 0
  };
}

function cargarLocal(){
  try {
    var raw = localStorage.getItem(LS_DB);
    if (raw) {
      var d = JSON.parse(raw);
      COLS.forEach(function(c){ DB[c] = d[c] || []; });
      DB.auditoria = d.auditoria || [];
      DB.mensajes = d.mensajes || [];
      rehacerSnap();
      DB.config = d.config || null;
      PENDIENTES = d._pend || {};
    }
  } catch (e) { console.error('DB local corrupta', e); }
  var base = configBase();
  DB.config = Object.assign(base, DB.config || {});
  if (!DB.config.plantillas) DB.config.plantillas = plantillasBase();
}

function guardarLocal(){
  var d = { _pend: PENDIENTES, config: DB.config, auditoria: DB.auditoria || [], mensajes: DB.mensajes || [] };
  COLS.forEach(function(c){ d[c] = DB[c]; });
  try { localStorage.setItem(LS_DB, JSON.stringify(d)); }
  catch (e) { alert('No se pudo guardar localmente (almacenamiento lleno). Exportá un backup.'); }
}

// Guarda (alta o modificación) un registro, lo marca para subir y re-renderiza.
function guardar(col, obj){
  if (soloLectura()) { toast('Tu usuario es de solo lectura'); return obj; }
  var ahora = new Date().toISOString();
  // versión anterior: la última guardada (los formularios modifican el objeto en el lugar antes de guardar)
  var anterior = obj.id && SNAP[col + "/" + obj.id] ? JSON.parse(SNAP[col + "/" + obj.id]) : null;
  obj.updatedAt = Date.now();
  if (!obj.id) obj.id = uid();
  if (!obj.creado) obj.creado = hoy();
  obj.audit = obj.audit || { creadoPor: quienSoy(), creadoEmail: emailYo(), creadoEl: ahora };
  obj.audit.modPor = quienSoy(); obj.audit.modEmail = emailYo(); obj.audit.modEl = ahora;
  var i = DB[col].findIndex(function(x){ return x.id === obj.id; });
  if (i >= 0) DB[col][i] = obj; else DB[col].push(obj);
  PENDIENTES[col + '/' + obj.id] = true;
  registrarAuditoria(col, obj, anterior);
  SNAP[col + "/" + obj.id] = JSON.stringify(obj);
  guardarLocal();
  programarSync();
  return obj;
}
function borrar(col, id){
  var o = DB[col].find(function(x){ return x.id === id; });
  if (!o) return;
  o = JSON.parse(JSON.stringify(o));
  o.deleted = true;
  guardar(col, o);
}
function guardarConfig(){
  if (soloLectura()) return;
  DB.config.updatedAt = Date.now();
  DB.config.modPor = quienSoy();
  PENDIENTES['config/config'] = true; PENDIENTES['config/publico'] = true;
  guardarLocal();
  programarSync();
}
// Lo que pueden leer dueños y locatarios de la configuración: sin plantillas, usuarios ni datos personales de los socios.
function configPublica(){
  var c = DB.config;
  return { id: 'publico', updatedAt: c.updatedAt || Date.now(), administrador: c.administrador, emisor: c.emisor, emisorDatos: c.emisorDatos,
    comisionPct: c.comisionPct, comisionBase: c.comisionBase, diaVencimiento: c.diaVencimiento, punitorioDiarioPct: c.punitorioDiarioPct,
    reciboPuntoVenta: c.reciboPuntoVenta, datosPago: c.datosPago || '', telAdministracion: c.telAdministracion || '',
    socios: c.socios.map(function(s){ return { id: s.id, nombre: s.nombre }; }) };
}

// ─── Google: login + Firestore + Drive ──────
// AUTH_TOKEN = token de Google para Drive (y para Firestore en el modo sin Firebase).
// Con Firebase, Firestore usa el token de la sesión de Firebase y aplica las reglas de seguridad.
var AUTH_TOKEN = null, tokenClient = null, SYNC_EST = 'local', _syncTimer = null;
function fsBase(){ return 'https://firestore.googleapis.com/v1/projects/' + (conFirebase() ? FB.projectId : PROJECT_ID) + '/databases/(default)/documents'; }
function conectado(){ return conFirebase() ? !!(FB_SES && USUARIO) : !!AUTH_TOKEN; }

function setSync(est, txt){
  SYNC_EST = est;
  $('sdot').className = 'dot ' + ({ on: 'on', busy: 'busy', err: 'err' }[est] || '');
  $('slabel').textContent = txt;
}
function clickSync(){
  if (conFirebase()) { if (!conectado()) mostrarLogin(); else sincronizar(true); return; }
  if (!AUTH_TOKEN) { conectarGoogle(); return; }
  sincronizar(true);
}
// Token de Google con permiso de Drive (archivos). En modo sin Firebase también da acceso a Firestore por IAM.
function conectarGoogle(silencioso, despues){
  if (!window.google || !google.accounts) { if (!silencioso) toast('Cargando Google… probá de nuevo en un segundo'); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: OAUTH_CLIENT_ID, scope: conFirebase() ? 'https://www.googleapis.com/auth/drive.file' : SCOPES,
    hint: USUARIO ? USUARIO.email : undefined,
    callback: function(r){
      if (r.error) { if (!conFirebase()) setSync('err', 'Error Google'); return; }
      AUTH_TOKEN = r.access_token;
      sessionStorage.setItem('inmoflow_tok', AUTH_TOKEN);
      sessionStorage.setItem('inmoflow_tok_exp', String(Date.now() + (r.expires_in || 3500) * 1000));
      if (!conFirebase()) { localStorage.setItem('inmoflow_google', '1'); sincronizar(true); }
      if (despues) despues();
    }
  });
  tokenClient.requestAccessToken({ prompt: '' });
}
// Para subir o abrir archivos: pide el permiso de Drive solo cuando hace falta.
function conDrive(fn){ if (AUTH_TOKEN || tokenGuardado()) return fn(); conectarGoogle(false, fn); }
function desconectarGoogle(){
  AUTH_TOKEN = null; sessionStorage.removeItem('inmoflow_tok'); localStorage.removeItem('inmoflow_google');
  setSync('local', 'Local'); renderTodo();
}
function tokenGuardado(){
  var t = sessionStorage.getItem('inmoflow_tok'), e = +sessionStorage.getItem('inmoflow_tok_exp') || 0;
  if (t && e > Date.now() + 60000) { AUTH_TOKEN = t; return true; }
  return false;
}
function hdrs(ct){ var h = { Authorization: 'Bearer ' + AUTH_TOKEN }; if (ct) h['Content-Type'] = ct; return h; }
function chk401(r){
  if (r.status === 401) { AUTH_TOKEN = null; sessionStorage.removeItem('inmoflow_tok'); setSync('err', 'Reconectar'); throw new Error('Sesión de Google vencida'); }
  if (r.status === 403) { setSync('err', 'Sin permiso'); throw new Error('Tu usuario no tiene permiso para esa operación (403)'); }
  return r;
}
// Headers para Firestore: sesión de Firebase (aplica reglas) o token de Google (IAM).
function fsHdrs(ct){
  var tok = conFirebase() ? fbToken() : Promise.resolve(AUTH_TOKEN);
  return tok.then(function(t){ var h = { Authorization: 'Bearer ' + t }; if (ct) h['Content-Type'] = ct; return h; });
}
function fsFetch(url, opts){
  return fsHdrs(opts && opts.body ? 'application/json' : null).then(function(h){ return fetch(url, Object.assign({}, opts || {}, { headers: h })); })
    .then(function(r){
      if (r.status === 401 && conFirebase()) { setSync('err', 'Ingresar'); throw new Error('La sesión venció: volvé a ingresar'); }
      if (r.status === 401) return chk401(r);
      if (r.status === 403) { setSync('err', 'Sin permiso'); throw new Error('Sin permiso para esa operación (403)'); }
      return r;
    });
}

// Cada registro se guarda como un documento Firestore con el JSON entero en un campo,
// más los campos que usan las reglas: visiblePara (qué socios lo pueden leer) y updatedBy.
function fsListAll(col){
  var out = [];
  function page(tok){
    return fsFetch(fsBase() + '/inmoflow_' + col + '?pageSize=300' + (tok ? '&pageToken=' + tok : ''))
      .then(function(r){ return r.json(); })
      .then(function(d){
        (d.documents || []).forEach(function(doc){ try { out.push(JSON.parse(doc.fields.json.stringValue)); } catch (e) {} });
        return d.nextPageToken ? page(d.nextPageToken) : out;
      });
  }
  return page();
}
// Para un dueño: solo los documentos donde figura en visiblePara (las reglas exigen esta consulta).
function fsQuerySocio(col, socioId){
  return fsRunQuery(col, { field: { fieldPath: 'visiblePara' }, op: 'ARRAY_CONTAINS', value: { stringValue: socioId } });
}
function fsRunQuery(col, filtro){
  return fsFetch(fsBase() + ':runQuery', { method: 'POST', body: JSON.stringify({ structuredQuery: {
    from: [{ collectionId: 'inmoflow_' + col }], where: { fieldFilter: filtro }
  } }) }).then(function(r){ return r.json(); }).then(function(arr){
    var out = [];
    (Array.isArray(arr) ? arr : []).forEach(function(x){ if (x.document) try { out.push(JSON.parse(x.document.fields.json.stringValue)); } catch (e) {} });
    return out;
  });
}
function fsGetDoc(col, id){
  return fsFetch(fsBase() + '/inmoflow_' + col + '/' + encodeURIComponent(id)).then(function(r){
    if (r.status === 404) return null;
    return r.json().then(function(d){
      var f = {};
      Object.keys(d.fields || {}).forEach(function(k){ var v = d.fields[k]; f[k] = v.stringValue != null ? v.stringValue : v.integerValue != null ? +v.integerValue : v.booleanValue; });
      if (f.json) try { return JSON.parse(f.json); } catch (e) {}
      return f;
    });
  }).catch(function(e){ if (/403/.test(e.message)) return null; throw e; });
}
function fsPut(col, obj){
  var vis = col === 'config' || col === 'auditoria' || col === 'mensajes' ? [] : visiblePara(col, obj);
  var data = obj;
  // el locatario no lee inmuebles (tienen costos y datos del dueño): el contrato lleva el nombre y la dirección
  if (col === 'contratos') { var inm = byId('inmuebles', obj.inmuebleId); data = Object.assign({}, obj, { _inm: inm ? { nombre: inm.nombre, direccion: inm.direccion || '', localidad: inm.localidad || '' } : (obj._inm || null) }); }
  var body = { fields: {
    json: { stringValue: JSON.stringify(data) },
    updatedAt: { integerValue: String(obj.updatedAt || Date.now()) },
    updatedBy: { stringValue: emailYo() },
    visiblePara: { arrayValue: { values: vis.map(function(s){ return { stringValue: s }; }) } }
  } };
  if (col === 'mensajes') { body.fields.hilo = { stringValue: obj.hilo }; body.fields.autorEmail = { stringValue: obj.autorEmail }; }
  // la auditoría solo se crea (las reglas no permiten modificarla): si ya existe, ya se subió antes
  var soloCrear = col === 'auditoria' ? '?currentDocument.exists=false' : '';
  return fsFetch(fsBase() + '/inmoflow_' + col + '/' + encodeURIComponent(obj.id) + soloCrear, { method: 'PATCH', body: JSON.stringify(body) })
    .then(function(r){ if (!r.ok && !(soloCrear && (r.status === 400 || r.status === 409))) throw new Error('Firestore ' + r.status); })
    .catch(function(e){ if (soloCrear && /403/.test(e.message)) return; throw e; });
}
// Usuarios: campos planos (las reglas los leen para saber el rol de cada uno).
function fsPutUsuario(u){
  var email = String(u.email).toLowerCase().trim();
  var body = { fields: { email: { stringValue: email }, nombre: { stringValue: u.nombre || '' }, rol: { stringValue: u.rol }, socioId: { stringValue: u.socioId || '' }, contratoId: { stringValue: u.contratoId || '' }, updatedBy: { stringValue: emailYo() } } };
  return fsFetch(fsBase() + '/inmoflow_usuarios/' + encodeURIComponent(email), { method: 'PATCH', body: JSON.stringify(body) })
    .then(function(r){ if (!r.ok) throw new Error('No se pudo guardar el usuario (' + r.status + ')'); return { email: email, nombre: u.nombre, rol: u.rol, socioId: u.socioId || '', contratoId: u.contratoId || '' }; });
}
function fsListUsuarios(){
  return fsFetch(fsBase() + '/inmoflow_usuarios?pageSize=100').then(function(r){ return r.json(); }).then(function(d){
    return (d.documents || []).map(function(doc){ var f = doc.fields || {}; function s(k){ return f[k] ? f[k].stringValue : ''; } return { email: s('email'), nombre: s('nombre'), rol: s('rol'), socioId: s('socioId'), contratoId: s('contratoId') }; });
  });
}
function fsDelUsuario(email){ return fsFetch(fsBase() + '/inmoflow_usuarios/' + encodeURIComponent(email), { method: 'DELETE' }); }

function programarSync(){
  if (!conectado()) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(function(){ sincronizar(false); }, 1200);
}

var _sincronizando = false;
function sincronizar(traer){
  if (conFirebase()) { if (!conectado()) return Promise.resolve(); }
  else if (!AUTH_TOKEN && !tokenGuardado()) return Promise.resolve();
  if (_sincronizando) return Promise.resolve();
  _sincronizando = true;
  setSync('busy', 'Sincronizando…');
  var duenio = conFirebase() && USUARIO.rol !== 'admin';
  var p = Promise.resolve();
  if (traer) {
    var cols = duenio ? COLS : COLS.concat(['auditoria']);
    p = Promise.all(cols.map(function(c){
      var q = duenio ? (claveDe(USUARIO) ? fsQuerySocio(c, claveDe(USUARIO)) : Promise.resolve([])) : fsListAll(c);
      return q.then(function(arr){ return [c, arr]; });
    }).concat([fsGetDoc('config', duenio ? 'publico' : 'config').then(function(cf){ return ['config', cf ? [cf] : []]; })]))
      .then(function(res){
        res.forEach(function(x){
          var c = x[0];
          if (duenio && c !== 'config') DB[c] = []; // el dueño conserva solo lo que el servidor le devuelve
          if (c === 'auditoria') {
            DB.auditoria = x[1].concat(DB.auditoria.filter(function(a){ return PENDIENTES['auditoria/' + a.id]; })).sort(function(a, b){ return a.fecha < b.fecha ? -1 : 1; });
            return;
          }
          x[1].forEach(function(rem){
            if (c === 'config') {
              if (duenio) { Object.assign(DB.config, rem); return; } // dueños y locatarios: solo la configuración pública
              if ((rem.updatedAt || 0) > (DB.config.updatedAt || 0) && !PENDIENTES['config/config']) DB.config = Object.assign(configBase(), rem);
              return;
            }
            var i = DB[c].findIndex(function(l){ return l.id === rem.id; });
            if (i < 0) DB[c].push(rem);
            else if ((rem.updatedAt || 0) > (DB[c][i].updatedAt || 0) && !PENDIENTES[c + '/' + rem.id]) DB[c][i] = rem;
          });
        });
        guardarLocal(); rehacerSnap();
      });
  }
  return p.then(function(){
    if (duenio) { PENDIENTES = {}; return; }
    var keys = Object.keys(PENDIENTES), fallas = [];
    // cada cambio se sube por separado: si uno falla, los demás siguen y el que falló se reintenta después
    return keys.reduce(function(acc, k){
      return acc.then(function(){
        var c = k.split('/')[0], id = k.slice(c.length + 1);
        var obj = c === 'config' ? (id === 'publico' ? configPublica() : DB.config) : (DB[c] || []).find(function(x){ return x.id === id; });
        if (!obj) { delete PENDIENTES[k]; return; }
        if (c === 'config' && id !== 'publico') obj.id = 'config';
        return fsPut(c, obj).then(function(){ delete PENDIENTES[k]; }).catch(function(e){ fallas.push(e.message); if (/sesión/i.test(e.message)) throw e; });
      });
    }, Promise.resolve()).then(function(){ if (fallas.length) throw new Error(fallas.length + ' cambio(s) no se pudieron subir (' + fallas[0] + '). Se reintenta en la próxima sincronización.'); });
  }).then(function(){
    guardarLocal();
    setSync('on', conFirebase() ? quienSoy() : 'Sincronizado');
    if (traer) { renderTodo(); if (typeof chatTraer === 'function') chatTraer(); }
  }).catch(function(e){
    console.error(e);
    setSync('err', 'Error sync');
    toast(e.message || 'Error al sincronizar', 4000);
  }).then(function(){ _sincronizando = false; });
}

function driveCarpeta(nombre, padre){

function fbLoginConGoogle(googleToken){

function fbToken(){

  return fetch('https://securetoken.googleapis.com/v1/token?key=' + FB.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(FB_SES.refreshToken)
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.error) { fbGuardarSes(null); throw new Error('La sesión venció: volvé a ingresar'); }
    FB_SES.idToken = d.id_token; FB_SES.refreshToken = d.refresh_token; FB_SES.exp = Date.now() + (+d.expires_in || 3600) * 1000;

  else if (col === 'pagos') { add('loc:' + o.contratoId); (o.distribucion || []).forEach(function(t){ add(t.socioId); }); (o.recibio || []).forEach(function(r){ if (r.quien !== 'admin') add(r.quien); }); if (!o.distribucion) deInm(o.inmuebleId); }
  else if (col === 'gastos') { (o.distribucion || []).forEach(function(t){ add(t.socioId); }); if (String(o.pagadoPor).indexOf('socio:') === 0) add(o.pagadoPor.slice(6)); if (!o.distribucion) deInm(o.inmuebleId); }
  else if (col === 'movimientos') { add(o.socioId); add(o.destinoId); }
  else if (col === 'comunicaciones') { add('loc:' + o.contratoId); var c = byId('contratos', o.contratoId); if (c) deInm(c.inmuebleId); }

  if (forzar || COT.ts < viejo) {
    tareas.push(Promise.all(['oficial', 'blue'].map(function(casa){
      return fetch('https://api.argentinadatos.com/v1/cotizaciones/dolares/' + casa).then(function(r){ return r.json(); })
        .then(function(arr){ var m = {}; arr.forEach(function(x){ if (x.fecha >= '2015') m[x.fecha] = x.venta; }); COT[casa] = m; });
    })).then(function(){
      // la cotización del día puede no estar todavía en el histórico: completar con DolarApi
      return fetch('https://dolarapi.com/v1/dolares').then(function(r){ return r.json(); }).then(function(arr){
        arr.forEach(function(x){ if ((x.casa === 'oficial' || x.casa === 'blue') && x.venta) COT[x.casa][hoy()] = COT[x.casa][hoy()] || x.venta; });
      }).catch(function(){});
    }).then(function(){ COT.ts = Date.now(); localStorage.setItem(LS_COT, JSON.stringify(COT)); }));
  }
  if (forzar || IDX.ts < viejo) {
    var desde = '2020-07-01';
    tareas.push(Promise.all([
      // la API del BCRA acepta como máximo limit=3000: se pagina con offset
      (function traerICL(offset, m){
        return fetch('https://api.bcra.gob.ar/estadisticas/v4.0/monetarias/40?desde=' + desde + '&hasta=' + hoy() + '&limit=3000&offset=' + offset).then(function(r){ return r.json(); })
          .then(function(d){
            var det = (d.results && d.results[0] && d.results[0].detalle) || [];
            det.forEach(function(x){ m[x.fecha] = x.valor; });
            var total = d.metadata && d.metadata.resultset ? d.metadata.resultset.count : 0;
            if (det.length && offset + det.length < total) return traerICL(offset + det.length, m);
            if (Object.keys(m).length) IDX.icl = m;
          });
      })(0, {}).catch(function(e){ console.warn('ICL', e); }),
      fetch('https://api.argentinadatos.com/v1/finanzas/indices/inflacion').then(function(r){ return r.json(); })
        .then(function(arr){ var m = {}; arr.forEach(function(x){ if (x.fecha >= '2015') m[x.fecha.slice(0, 7)] = x.valor; }); IDX.ipc = m; }).catch(function(e){ console.warn('IPC', e); }),
      fetch('https://api.argentinadatos.com/v1/finanzas/indices/uva').then(function(r){ return r.json(); })
        .then(function(arr){ var m = {}; arr.forEach(function(x){ if (x.fecha >= '2019') m[x.fecha] = x.valor; }); IDX.uva = m; }).catch(function(e){ console.warn('UVA', e); })
    ]).then(function(){ IDX.ts = Date.now(); localStorage.setItem(LS_IDX, JSON.stringify(IDX)); }));
  }
  return Promise.all(tareas);
}

// Valor de una serie diaria en una fecha; si ese día no hay dato (feriado, fin de semana) toma el anterior.
function serieEn(mapa, fecha, maxDias){
  var f = fecha;
  for (var i = 0; i <= (maxDias || 12); i++) {
    if (mapa[f] != null) return { v: mapa[f], fecha: f };
    f = addDias(f, -1);
  }
  return null;
}
function ultimaFecha(mapa){ var k = Object.keys(mapa); return k.length ? k.sort().pop() : null; }
function cotiz(casa, fecha){
  var f = fecha > hoy() ? hoy() : fecha;
  var r = serieEn(COT[casa] || {}, f, 15);
  if (!r) { var u = ultimaFecha(COT[casa] || {}); if (u && f > u) r = { v: COT[casa][u], fecha: u }; }
  return r ? r.v : 0;
}
function cotizHoy(){ return { oficial: cotiz('oficial', hoy()), blue: cotiz('blue', hoy()) }; }

// ─── contratos: montos, ajustes y estado ─────
var INDICES = {
  ICL: 'ICL (BCRA) — Ley 27.551',
  IPC: 'IPC (INDEC)',
  UVA: 'UVA (BCRA)',
  CASA_PROPIA: 'Casa Propia (manual)',
  FIJO: 'Porcentaje fijo',
  MANUAL: 'Manual / a convenir',
  NINGUNO: 'Sin actualización'
};

function contratoActivo(c, p){
  p = p || perHoy();
  if (c.deleted || c.estado === 'rescindido' && c.fechaRescision && per(c.fechaRescision) < p) return false;
  return per(c.inicio) <= p && (!c.fin || per(c.fin) >= p) && c.estado !== 'finalizado';
}
function montosOrd(c){ return (c.montos || []).slice().sort(function(a, b){ return a.desde < b.desde ? -1 : 1; }); }
function montoVigente(c, p){
  var ms = montosOrd(c), m = 0;
  for (var i = 0; i < ms.length; i++) if (ms[i].desde <= p) m = num(ms[i].monto);
  if (!m && ms.length) m = num(ms[0].monto);
  return m;
}
function ultimoTramo(c, p){ var ms = montosOrd(c), t = ms[0]; ms.forEach(function(x){ if (x.desde <= p) t = x; }); return t; }

// Calendario de ajustes: primerAjuste + k·periodicidad, hasta el fin del contrato.
function calendarioAjustes(c){
  var n = +c.periodicidad || 0;
  if (!n || c.indice === 'NINGUNO') return [];
  var p = c.primerAjuste || perAdd(per(c.inicio), n), fin = c.fin ? per(c.fin) : perAdd(perHoy(), 36), out = [];
  for (var k = 0; k < 60 && p <= fin; k++) { out.push(p); p = perAdd(p, n); }
  return out;
}
function proximoAjuste(c){
  var ya = (c.montos || []).map(function(m){ return m.desde; });
  var cal = calendarioAjustes(c);
  for (var i = 0; i < cal.length; i++) if (ya.indexOf(cal[i]) < 0) return cal[i];
  return null;
}

// Calcula el nuevo monto para el ajuste del período p. Devuelve {monto, coef, detalle, estimado}
function calcularAjuste(c, p){
  var anterior = perAdd(p, -1), base = montoVigente(c, anterior), tramo = ultimoTramo(c, anterior);
  var desde = tramo ? tramo.desde : per(c.inicio), n = +c.periodicidad || perDiff(desde, p);
  var dia = c.inicio ? c.inicio.slice(8, 10) : '01';
  var res = { base: base, coef: 1, detalle: '', estimado: false, monto: base };
  if (c.indice === 'ICL' || c.indice === 'UVA') {
    var mapa = c.indice === 'ICL' ? IDX.icl : IDX.uva;
    var fa = desde + '-' + dia, fb = p + '-' + dia, ult = ultimaFecha(mapa);
    if (!ult) { res.detalle = 'Sin datos de ' + c.indice + ' (sin conexión)'; res.estimado = true; return res; }
    if (fb > ult) { fb = ult; res.estimado = true; }
    var va = serieEn(mapa, fa), vb = serieEn(mapa, fb);
    if (!va || !vb) { res.detalle = 'Faltan valores de ' + c.indice; res.estimado = true; return res; }
    res.coef = vb.v / va.v;
    res.detalle = c.indice + ' ' + fDate(va.fecha) + ': ' + va.v.toLocaleString('es-AR') + ' → ' + fDate(vb.fecha) + ': ' + vb.v.toLocaleString('es-AR');
  } else if (c.indice === 'IPC') {
    // IPC de los n meses previos con desfase de un mes (el IPC de mes anterior se publica a mediados del mes).
    var desf = c.ipcDesfase == null ? 1 : +c.ipcDesfase, coef = 1, usados = [];
    for (var i = n; i >= 1; i--) {
      var m = perAdd(p, -i - desf), v = IDX.ipc[m];
      if (v == null) { res.estimado = true; var ks = Object.keys(IDX.ipc).sort(); v = ks.length ? IDX.ipc[ks[ks.length - 1]] : 0; usados.push(perCorto(m) + ' ~' + v + '%'); }
      else usados.push(perCorto(m) + ' ' + v + '%');
      coef *= 1 + v / 100;
    }
    res.coef = coef;
    res.detalle = 'IPC: ' + usados.join(' · ');
  } else if (c.indice === 'FIJO') {
    res.coef = 1 + num(c.pctFijo) / 100;
    res.detalle = 'Aumento fijo ' + pct(c.pctFijo);
  } else {
    res.detalle = 'Índice manual: cargá el nuevo monto';
    res.estimado = true;
  }
  res.monto = Math.round(base * res.coef);
  return res;
}

// ─── pagos ───────────────────────────────────
function pagosDe(contratoId){ return vivos('pagos').filter(function(p){ return p.contratoId === contratoId; }); }
function ingresoPago(p){ return num(p.alquiler) + num(p.punitorios) + sum((p.extras || []).filter(function(e){ return e.tipo !== 'reintegro'; }), function(e){ return e.monto; }); }
function totalPago(p){ return num(p.alquiler) + num(p.punitorios) + sum(p.extras || [], function(e){ return e.monto; }) - num(p.descuento); }
function netoPago(p){ return ingresoPago(p) - num(p.descuento) - num(p.comision); }

function distribucionInm(inm){
  var t = (inm && inm.titulares && inm.titulares.length) ? inm.titulares : [{ socioId: DB.config.socios[0].id, pct: 100 }];
  return t;
}
// fracción que le toca a la "vista" actual (total o un socio)
var VISTA = localStorage.getItem('inmoflow_vista') || 'total';
function factor(dist){
  if (VISTA === 'total') return 1;
  var d = (dist || []).find(function(x){ return x.socioId === VISTA; });
  return d ? num(d.pct) / 100 : 0;
}
function factorInm(inm){ return factor(distribucionInm(inm)); }
function nombreSocio(id){ var s = DB.config.socios.find(function(x){ return x.id === id; }); return s ? s.nombre : id; }

// Cuenta corriente: por cada mes del contrato, lo que se debía y lo que se pagó.
function cuentaCorriente(c){
  var desde = per(c.inicio), hasta = perHoy();
  if (c.ccDesde && c.ccDesde > desde) desde = c.ccDesde; // meses anteriores a la gestión en InmoFlow no se reclaman
  if (c.fin && per(c.fin) < hasta) hasta = per(c.fin);
  if (c.estado === 'finalizado' && c.fechaFinReal) hasta = per(c.fechaFinReal);
  var pagos = pagosDe(c.id), filas = [], saldo = 0, dv = +c.diaVencimiento || DB.config.diaVencimiento || 10;
  for (var p = desde, k = 0; p <= hasta && k < 240; p = perAdd(p, 1), k++) {
    var deb = montoVigente(c, p);
    var ps = pagos.filter(function(x){ return x.periodo === p; });
    var pag = sum(ps, function(x){ return x.alquiler; });
    saldo += deb - pag;
    var venc = p + '-' + p2(Math.min(dv, 28));
    var est = pag >= deb - 1 ? 'pagado' : pag > 0 ? 'parcial' : (hoy() > venc ? 'vencido' : 'pendiente');
    filas.push({ periodo: p, debe: deb, pagado: pag, saldo: saldo, estado: est, pagos: ps, venc: venc });
  }
  return { filas: filas, saldo: saldo };
}
function deudaContrato(c){ return cuentaCorriente(c).filas.filter(function(f){ return f.estado === 'vencido' || f.estado === 'parcial'; }); }

// Punitorios sugeridos por mora (interés diario sobre el alquiler adeudado).
function punitorioSugerido(c, periodo, fechaPago, monto){
  var dv = +c.diaVencimiento || DB.config.diaVencimiento || 10, venc = periodo + '-' + p2(Math.min(dv, 28));
  var dias = diasEntre(venc, fechaPago);
  var tasa = c.punitorioPct != null && c.punitorioPct !== '' ? num(c.punitorioPct) : num(DB.config.punitorioDiarioPct);
  if (dias <= 0 || !tasa) return { dias: 0, monto: 0 };
  return { dias: dias, monto: Math.round(monto * tasa / 100 * dias) };
}

// ─── costo, gastos y rentabilidad ────────────
function costoInmueble(inm){
  var o = { ars: 0, of: 0, bl: 0 };
  (inm.costos || []).forEach(function(x){
    var cof = num(x.cotOf) || cotiz('oficial', x.fecha), cbl = num(x.cotBl) || cotiz('blue', x.fecha);
    var ars = x.moneda === 'ARS' ? num(x.monto) : num(x.monto) * (x.moneda === 'USD_BLUE' ? cbl : cof);
    o.ars += ars;
    if (x.moneda === 'USD_OF') { o.of += num(x.monto); o.bl += cbl ? ars / cbl : 0; }
    else if (x.moneda === 'USD_BLUE') { o.bl += num(x.monto); o.of += cof ? ars / cof : 0; }
    else { o.of += cof ? ars / cof : 0; o.bl += cbl ? ars / cbl : 0; }
  });
  vivos('gastos').forEach(function(g){
    if (g.inmuebleId !== inm.id || !g.capital) return;
    o.ars += num(g.montoARS); o.of += usdGasto(g, 'oficial'); o.bl += usdGasto(g, 'blue');
  });
  return o;
}
function gastoARS(g){ return g.moneda === 'USD' ? num(g.monto) * (num(g.cotBl) || cotiz('blue', g.fecha)) : num(g.monto); }
function usdGasto(g, casa){
  var c = casa === 'blue' ? (num(g.cotBl) || cotiz('blue', g.fecha)) : (num(g.cotOf) || cotiz('oficial', g.fecha));
  if (g.moneda === 'USD') return num(g.monto);
  return c ? num(g.montoARS || g.monto) / c : 0;
}
function usdPago(p, casa){
  var c = casa === 'blue' ? (num(p.cotBl) || cotiz('blue', p.fecha)) : (num(p.cotOf) || cotiz('oficial', p.fecha));
  return c ? netoPago(p) / c : 0;
}

function rentabilidad(inm){
  var f = factorInm(inm), costo = costoInmueble(inm);
  var desde12 = addDias(hoy(), -365);
  var pagos = vivos('pagos').filter(function(p){ return p.inmuebleId === inm.id; });
  var gastos = vivos('gastos').filter(function(g){ return g.inmuebleId === inm.id && !g.capital && g.pagadoPor !== 'locatario'; });
  var r = {
    costoARS: costo.ars * f, costoOf: costo.of * f, costoBl: costo.bl * f,
    brutoARS: 0, comisionARS: 0, gastosARS: 0, netoARS: 0,
    netoOf: 0, netoBl: 0, neto12Of: 0, neto12Bl: 0, neto12ARS: 0, bruto12ARS: 0, gastos12Of: 0, gastos12Bl: 0,
    meses: {}
  };
  pagos.forEach(function(p){
    var fp = factor(p.distribucion || distribucionInm(inm));
    var of = usdPago(p, 'oficial') * fp, bl = usdPago(p, 'blue') * fp;
    r.brutoARS += ingresoPago(p) * fp; r.comisionARS += num(p.comision) * fp; r.netoARS += netoPago(p) * fp;
    r.netoOf += of; r.netoBl += bl;
    if (p.fecha >= desde12) { r.neto12Of += of; r.neto12Bl += bl; r.neto12ARS += netoPago(p) * fp; r.bruto12ARS += ingresoPago(p) * fp; }
    var m = per(p.fecha); r.meses[m] = (r.meses[m] || 0) + bl;
  });
  gastos.forEach(function(g){
    var fg = factor(g.distribucion || distribucionInm(inm));
    var of = usdGasto(g, 'oficial') * fg, bl = usdGasto(g, 'blue') * fg;
    r.gastosARS += num(g.montoARS || gastoARS(g)) * fg;
    r.netoOf -= of; r.netoBl -= bl;
    if (g.fecha >= desde12) { r.neto12Of -= of; r.neto12Bl -= bl; r.gastos12Of += of; r.gastos12Bl += bl; r.neto12ARS -= num(g.montoARS) * fg; }
    var m = per(g.fecha); r.meses[m] = (r.meses[m] || 0) - bl;
  });
  // Rentabilidad anualizada: si hay menos de 12 meses de historia, se anualiza lo que hay.
  var primer = pagos.reduce(function(a, p){ return !a || p.fecha < a ? p.fecha : a; }, null);
  var mesesHist = primer ? Math.min(12, Math.max(1, diasEntre(primer, hoy()) / 30.4 + 1)) : 0;
  r.mesesHist = mesesHist;
  r.anualOf = mesesHist ? r.neto12Of * 12 / mesesHist : 0;
  r.anualBl = mesesHist ? r.neto12Bl * 12 / mesesHist : 0;
  r.rentOf = r.costoOf ? r.anualOf / r.costoOf * 100 : 0;
  r.rentBl = r.costoBl ? r.anualBl / r.costoBl * 100 : 0;
  r.recupOf = r.costoOf ? r.netoOf / r.costoOf * 100 : 0;
  r.recupBl = r.costoBl ? r.netoBl / r.costoBl * 100 : 0;
  r.paybackOf = r.anualOf > 0 ? r.costoOf / r.anualOf : null;            // años totales
  r.paybackBl = r.anualBl > 0 ? r.costoBl / r.anualBl : null;
  r.restaOf = r.anualOf > 0 ? Math.max(0, (r.costoOf - r.netoOf) / r.anualOf) : null; // años que faltan
  r.restaBl = r.anualBl > 0 ? Math.max(0, (r.costoBl - r.netoBl) / r.anualBl) : null;
  return r;
}
function anios(x){
  if (x == null) return '—';
  if (x < 1) return Math.round(x * 12) + ' meses';
  var a = Math.floor(x), m = Math.round((x - a) * 12);
  if (m === 12) { a++; m = 0; }
  return a + (a === 1 ? ' año' : ' años') + (m ? ' ' + m + ' m' : '');
}

// ─── número a letras (recibos) ───────────────
function enLetras(n){
  n = Math.round(num(n) * 100) / 100;
  var ent = Math.floor(n), cent = Math.round((n - ent) * 100);
  var U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  var D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  var C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  function cien(x){
    if (x === 0) return '';
    if (x === 100) return 'cien';
    var c = Math.floor(x / 100), r = x % 100, s = C[c];
    if (r) s += (s ? ' ' : '') + (r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' y ' + U[r % 10] : ''));
    return s;
  }
  function mil(x){
    var m = Math.floor(x / 1000), r = x % 1000, s = '';
    if (m) s = (m === 1 ? 'mil' : cien(m).replace(/uno$/, 'un') + ' mil');
    if (r) s += (s ? ' ' : '') + cien(r);
    return s;
  }
  function todo(x){
    if (x === 0) return 'cero';
    var mm = Math.floor(x / 1e6), r = x % 1e6, s = '';
    if (mm) s = mm === 1 ? 'un millón' : mil(mm).replace(/uno$/, 'un') + ' millones';
    if (r) s += (s ? ' ' : '') + mil(r);
    return s;
  }
  var txt = todo(ent).replace(/uno$/, 'un');
  return (txt + (cent ? ' con ' + p2(cent) + '/100' : '')).toUpperCase();
}

// Honorarios inmobiliarios (única vez, al firmar): % sobre el valor total del contrato o sobre un mes de alquiler.
function honorariosContrato(c){
  var pctH = num(c.honorariosPct), ms = montosOrd(c), mensual = ms.length ? num(ms[0].monto) : 0;
  var meses = c.inicio && c.fin ? Math.max(1, perDiff(per(c.inicio), per(addDias(c.fin, 1)))) : 0;
  var tipo = c.honorariosBase === 'mes' ? 'mes' : 'total';
  var base = tipo === 'mes' ? mensual : mensual * meses;
  return { pct: pctH, baseTipo: tipo, base: base, mensual: mensual, meses: meses, monto: r2(base * pctH / 100),
    paga: c.honorariosPaga === 'locatario' ? 'locatario' : 'locador', mes: c.honorariosMes || (c.inicio ? per(c.inicio) : '') };
}

function svgEl(tag, attrs, parent){

function niceMax(v){

// ─── curva de recupero: neto acumulado en US$ vs inversión, con proyección ───

function vizRecupero(el, o){
  vizMontar(el, function(){
    el.textContent = '';
    var pts = o.puntos; if (!pts.length || !o.meta) { el.innerHTML = '<div class="empty">Cargá el costo y registrá cobros para ver la curva de recupero.</div>'; return; }
    var W = Math.max(260, el.clientWidth), H = 230, m = { t: 16, r: 14, b: 26, l: 56 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var f0 = new Date(pts[0].fecha + 'T12:00').getTime(), ult = pts[pts.length - 1];
    var fFin = new Date(ult.fecha + 'T12:00').getTime(), proy = null;
    if (o.anual > 0 && ult.acum < o.meta) {
      var anios2 = (o.meta - ult.acum) / o.anual, fp = fFin + anios2 * 365.25 * 864e5;
      proy = { t: fp, fecha: new Date(fp).toISOString().slice(0, 10) };
    }
    var t1 = Math.max(proy ? proy.t : fFin, f0 + 864e5 * 60);
    var max = niceMax(Math.max(o.meta, ult.acum) * 1.05);
    var x = function(t){ return m.l + (t - f0) / (t1 - f0) * iw; }, y = function(v){ return m.t + ih - Math.max(0, v) / max * ih; };
    var svg = svgEl('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H }, el);
    for (var k = 0; k <= 4; k++) { var vv = max * k / 4, yy = Math.round(y(vv)) + .5; svgEl('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: k ? 'v-grid' : 'v-base' }, svg); svgTxt(svg, m.l - 8, yy + 4, compacto(vv, 'US$ '), { class: 'v-tick', 'text-anchor': 'end' }); }
    var y1 = new Date(f0).getFullYear(), y2 = new Date(t1).getFullYear(), pasoA = Math.max(1, Math.ceil((y2 - y1 + 1) / Math.max(1, Math.floor(iw / 50))));
    for (var a = y1 + 1; a <= y2; a += pasoA) { var xa = x(new Date(a + '-01-01T12:00').getTime()); if (xa > m.l + 10 && xa < W - m.r - 10) svgTxt(svg, xa, H - 8, String(a), { class: 'v-tick', 'text-anchor': 'middle' }); }
    // meta (inversión)
    var ym = Math.round(y(o.meta)) + .5;
    svgEl('line', { x1: m.l, x2: W - m.r, y1: ym, y2: ym, class: 'v-meta' }, svg);
    svgTxt(svg, m.l + 6, ym - 6, 'Inversión ' + fmtU(o.meta), { class: 'v-lab' });
    // área + línea real
    var p = pts.map(function(q){ return [x(new Date(q.fecha + 'T12:00').getTime()), y(q.acum)]; });
    var linea = 'M' + p.map(function(q){ return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join('L');
    svgEl('path', { d: linea + 'L' + p[p.length - 1][0].toFixed(1) + ',' + y(0) + 'L' + p[0][0].toFixed(1) + ',' + y(0) + 'Z', fill: 'var(--s1)', 'fill-opacity': .1 }, svg);
    if (proy) svgEl('line', { x1: p[p.length - 1][0], y1: p[p.length - 1][1], x2: x(proy.t), y2: y(o.meta), class: 'v-proy' }, svg);
    svgEl('path', { d: linea, fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    var u = p[p.length - 1];
    svgEl('circle', { cx: u[0], cy: u[1], r: 4.5, fill: 'var(--s1)', class: 'v-dot' }, svg);
    if (proy) { svgEl('circle', { cx: x(proy.t), cy: y(o.meta), r: 4.5, class: 'v-dot v-dot-proy' }, svg); svgTxt(svg, Math.min(x(proy.t), W - m.r - 4), y(o.meta) + 16, 'Recupero ~' + perNom(per(proy.fecha)), { class: 'v-lab', 'text-anchor': 'end' }); }
    // crosshair
    var ch = svgEl('line', { y1: m.t, y2: m.t + ih, class: 'v-cross', visibility: 'hidden' }, svg);
    var hit = svgEl('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' }, svg);
    hit.addEventListener('pointermove', function(ev){
      var bx = svg.getBoundingClientRect(), mx = ev.clientX - bx.left, best = 0;
      p.forEach(function(q, i){ if (Math.abs(q[0] - mx) < Math.abs(p[best][0] - mx)) best = i; });
      var enProy = proy && mx > u[0] + 12;
      ch.setAttribute('x1', enProy ? x(proy.t) : p[best][0]); ch.setAttribute('x2', enProy ? x(proy.t) : p[best][0]); ch.setAttribute('visibility', 'visible');
      if (enProy) vizMostrar(ev, 'Proyección', [{ v: perNom(per(proy.fecha)), l: 'recupero estimado al ritmo actual' }, { v: fmtU(o.anual) + '/año', l: 'neto actual', c: 'var(--s1)', linea: true }]);
      else vizMostrar(ev, fDate(pts[best].fecha), [{ v: fmtU(pts[best].acum), l: 'neto acumulado', c: 'var(--s1)', linea: true }, { v: pct(pts[best].acum / o.meta * 100), l: 'de la inversión' }]);
    });
    hit.addEventListener('pointerleave', function(){ ch.setAttribute('visibility', 'hidden'); vizOcultar(); });
  });
}

function alertas(){
  var out = [], ph = perHoy(), lim = DB.config.avisoAjusteDias || 30;
  vivos('contratos').forEach(function(c){
    var est = estadoContrato(c);
    if (est !== 'vigente') return;
    var nombre = (c.locatario && c.locatario.nombre) || 'Contrato';
    var pa = proximoAjuste(c);
    if (pa) {
      var dias = diasEntre(hoy(), pa + '-01');
      if (dias <= lim) {
        var aj = calcularAjuste(c, pa);
        out.push({
          nivel: dias < 0 ? 'bad' : 'warn', tipo: 'ajuste', contratoId: c.id, periodo: pa, orden: dias,
          titulo: (dias < 0 ? 'Ajuste pendiente de aplicar: ' : 'Actualiza en ' + perNom(pa) + ': ') + esc(nombre),
          texto: fmt(aj.base) + ' → <b>' + fmt(aj.monto) + '</b> (' + (aj.coef > 1 ? '+' + pct((aj.coef - 1) * 100, 2) : '—') + ', ' + esc(INDICES[c.indice] || c.indice) + ')' + (aj.estimado ? ' <span class="tag t-warn">estimado</span>' : ''),
          acts: '<button class="btn sm p" onclick="modalAjuste(\'' + c.id + '\',\'' + pa + '\')">Aplicar</button><button class="btn sm" onclick="modalMensaje(\'' + c.id + '\',\'ajuste\')">Avisar</button>'
        });
      }
    }
    if (c.fin) {
      var df = diasEntre(hoy(), c.fin);
      if (df >= 0 && df <= (DB.config.avisoVencimientoDias || 60)) out.push({
        nivel: df <= 30 ? 'bad' : 'warn', tipo: 'vence', contratoId: c.id, orden: df,
        titulo: 'Contrato vence en ' + df + ' días: ' + esc(nombre), texto: 'Fin: ' + fDate(c.fin) + ' — ' + esc(nombreInm(c.inmuebleId)),
        acts: '<button class="btn sm" onclick="modalMensaje(\'' + c.id + '\',\'vencimiento\')">Avisar</button><button class="btn sm" onclick="verContrato(\'' + c.id + '\',\'datos\')">Ver</button>'
      });
    }
    var deuda = deudaContrato(c);
    if (deuda.length) {
      var tot = sum(deuda, function(f){ return f.debe - f.pagado; });
      out.push({
        nivel: 'bad', tipo: 'mora', contratoId: c.id, orden: -100 - deuda.length,
        titulo: 'Deuda de ' + esc(nombre) + ': ' + fmt(tot),
        texto: deuda.map(function(f){ return perNom(f.periodo) + (f.estado === 'parcial' ? ' (parcial)' : ''); }).join(', '),
        acts: '<button class="btn sm p" onclick="modalPago(null,\'' + c.id + '\')">Cobrar</button><button class="btn sm" onclick="modalMensaje(\'' + c.id + '\',\'mora\')">Reclamar</button>'
      });
    } else {
      var f0 = cuentaCorriente(c).filas.filter(function(f){ return f.periodo === ph; })[0];
      if (f0 && f0.estado === 'pendiente') out.push({
        nivel: 'info', tipo: 'pendiente', contratoId: c.id, orden: 500,
        titulo: 'A cobrar ' + perNom(ph) + ': ' + esc(nombre), texto: fmt(f0.debe) + ' — vence el ' + fDate(f0.venc),
        acts: '<button class="btn sm p" onclick="modalPago(null,\'' + c.id + '\')">Cobrar</button><button class="btn sm" onclick="modalMensaje(\'' + c.id + '\',\'recordatorio\')">Recordar</button>'
      });
    }
  });
  return out.sort(function(a, b){ return a.orden - b.orden; });
}
function htmlAlerta(a){
  var ic = { bad: '!', warn: '↑', info: '$', ok: '✓' }[a.nivel];
  if (a.tipo === 'vence') ic = '⏱';
  return '<div class="alert ' + a.nivel + '"><div class="ic">' + ic + '</div><div class="tx"><div class="b">' + a.titulo + '</div><div class="small muted">' + a.texto + '</div></div><div class="acts">' + a.acts + '</div></div>';
}

// Notificación del navegador una vez por día si hay ajustes o vencimientos.
function notificarSiCorresponde(){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (localStorage.getItem('inmoflow_notif') === hoy()) return;
  var al = alertas().filter(function(a){ return a.tipo === 'ajuste' || a.tipo === 'vence' || a.tipo === 'mora'; });
  if (!al.length) return;
  localStorage.setItem('inmoflow_notif', hoy());
  var aj = al.filter(function(a){ return a.tipo === 'ajuste'; }).length, mo = al.filter(function(a){ return a.tipo === 'mora'; }).length, ve = al.filter(function(a){ return a.tipo === 'vence'; }).length;
  try { new Notification('InmoFlow', { body: [aj && aj + ' ajuste(s) de alquiler', mo && mo + ' deuda(s)', ve && ve + ' contrato(s) por vencer'].filter(Boolean).join(' · '), icon: 'icon-192.png' }); } catch (e) {}
}

    '<div class="kpis">' +
      kpi('A cobrar este mes', fmt(esperadoMes), activos.length + ' contratos vigentes') +
      kpi('Cobrado', fmt(cobradoMes), esperadoMes ? pct(cobradoMes / esperadoMes * 100, 0) + ' del mes' : '') +
      kpi('Neto propietario', fmt(netoMes), (ct.blue ? '<span class="usd-b">' + fmtU(netoMes / ct.blue) + ' blue</span>' : '') + (ct.oficial ? ' · <span class="usd-o">' + fmtU(netoMes / ct.oficial) + ' of.</span>' : '')) +
      kpi('Gastos del mes', fmt(gastosMes), '') +
      kpi('Deuda de locatarios', fmt(deuda), deuda ? '<span style="color:var(--bad)">a reclamar</span>' : 'al día') +
      kpi('Inmuebles', inms.length, libres ? libres + ' sin contrato vigente' : 'todos alquilados') +
    '</div>' +
    '<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="modalPago()">+ Registrar cobro</button><button class="btn" onclick="ir(\'recibos\')">Recibos</button><button class="btn" onclick="modalGasto()">+ Gasto</button><button class="btn" onclick="modalContrato()">+ Contrato</button><button class="btn" onclick="ir(\'liquidacion\')">Liquidación del mes</button></div>' +
    (inms.length ? '' : '<div class="alert info"><div class="ic">i</div><div class="tx"><b>Empezá cargando tus datos</b><div class="small muted">Podés importar la planilla de alquileres desde Ajustes → Importar, o crear inmuebles y contratos a mano.</div></div><div class="acts"><button class="btn sm p" onclick="ir(\'ajustes\')">Importar</button></div></div>') +

        '<div class="v-key" id="pv-key"></div><div class="viz" id="pv-chart"></div><div class="hint" id="pv-tot" style="margin-top:6px"></div></div>' +
      '<div class="card"><h3>Estado de cobro — ' + perNom(ph) + '</h3><div class="viz" id="pv-estado"></div>' +
        '<div class="row" style="margin-top:12px"><span class="muted">Cobrado</span><span>' + fmt(est.pagado) + ' de ' + fmt(est.total) + '</span></div></div>' +
      '<div class="card"><h3>Alertas y vencimientos</h3>' + (al.length ? al.slice(0, 14).map(htmlAlerta).join('') + (al.length > 14 ? '<div class="hint">y ' + (al.length - 14) + ' más…</div>' : '') : '<div class="empty">Todo en orden ✓</div>') + '</div>' +
    '</div>';
  graficoPanel(serie);
  vizEstado($('pv-estado'), [
    { label: 'Pagado', icono: '✓', valor: est.pagado, color: 'var(--st-good)', texto: fmt(est.pagado) + ' · ' + est.nPagado },
    { label: 'Parcial', icono: '◐', valor: est.parcial, color: 'var(--st-warn)', texto: fmt(est.parcial) + ' · ' + est.nParcial },
    { label: 'Por vencer', icono: '○', valor: est.pendiente, color: 'var(--v-base)', texto: fmt(est.pendiente) + ' · ' + est.nPendiente },

var PANEL_MON = localStorage.getItem('inmoflow_pmon') || 'ars';

// Serie de los últimos n meses, por período del alquiler: cobrado, a cobrar, neto y su valor en US$.
function serieMensual(n){
  var ph = perHoy(), out = [];
  for (var k = n - 1; k >= 0; k--) {
    var mm = perAdd(ph, -k);
    var ps = vivos('pagos').filter(function(p){ return p.periodo === mm; });
    var esperado = sum(vivos('contratos').filter(function(c){
      return per(c.inicio) <= mm && (!c.fin || per(c.fin) >= mm) && (!c.fechaFinReal || per(c.fechaFinReal) >= mm) && c.estado !== 'rescindido';
    }), function(c){ var i = byId('inmuebles', c.inmuebleId); return montoVigente(c, mm) * (i ? factorInm(i) : 1); });
    out.push({
      m: mm, esperado: esperado, n: ps.length,
      cobrado: sum(ps, function(p){ return num(p.alquiler) * factor(p.distribucion); }),
      neto: sum(ps, function(p){ return netoPago(p) * factor(p.distribucion); }),
      blue: sum(ps, function(p){ return usdPago(p, 'blue') * factor(p.distribucion); }),
      oficial: sum(ps, function(p){ return usdPago(p, 'oficial') * factor(p.distribucion); })
    });
  }
  return out;
}
function graficoPanel(serie){
  var ars = PANEL_MON === 'ars';
  $('pv-tit').textContent = ars ? 'Cobrado vs. a cobrar por mes' : 'Neto cobrado en dólar ' + PANEL_MON + ' por mes';
  $('pv-key').innerHTML = ars ? '<span><i style="background:var(--s1)"></i>Cobrado</span><span><i class="l" style="background:var(--s2)"></i>A cobrar (contratos vigentes)</span>' : '';
  var tot = sum(serie, function(s){ return ars ? s.cobrado : s[PANEL_MON]; });
  $('pv-tot').innerHTML = 'Últimos 12 meses: <b>' + (ars ? fmt(tot) : fmtU(tot)) + '</b>' + (ars ? ' cobrados de ' + fmt(sum(serie, function(s){ return s.esperado; })) : ' netos') + ' · tocá una columna para ver la liquidación de ese mes';
  vizColumnas($('pv-chart'), {
    cats: serie.map(function(s){ return s.m; }), etiquetas: serie.map(function(s){ return perCorto(s.m); }),
    barras: { valores: serie.map(function(s){ return ars ? s.cobrado : s[PANEL_MON]; }), color: 'var(--s1)' },
    linea: ars ? { valores: serie.map(function(s){ return s.esperado; }), color: 'var(--s2)' } : null,
    fmtEje: function(v){ return compacto(v, ars ? '$ ' : 'US$ '); }, destacar: serie.length - 1,
    aria: 'Cobros de los últimos 12 meses',
    tip: function(i){
      var s = serie[i];
      return { titulo: perNom(s.m), filas: [
        { v: fmt(s.cobrado), l: 'cobrado', c: ars ? 'var(--s1)' : null },
        { v: fmt(s.esperado), l: 'a cobrar', c: ars ? 'var(--s2)' : null, linea: true },
        { v: fmt(s.neto), l: 'neto propietario' },
        { v: fmtU(s.blue), l: 'neto en blue', c: PANEL_MON === 'blue' ? 'var(--s1)' : null },
        { v: fmtU(s.oficial), l: 'neto en oficial', c: PANEL_MON === 'oficial' ? 'var(--s1)' : null },
        { v: String(s.n), l: s.n === 1 ? 'cobro' : 'cobros' }
      ] };
    },
    click: function(i){ LIQ.per = serie[i].m; ir('liquidacion'); }
  });
}
function estadoCobroMes(p){
  var r = { total: 0, pagado: 0, parcial: 0, parcialPag: 0, pendiente: 0, vencido: 0, nPagado: 0, nParcial: 0, nPendiente: 0, nVencido: 0 };
  vivos('contratos').filter(function(c){ return estadoContrato(c) === 'vigente'; }).forEach(function(c){
    var f = cuentaCorriente(c).filas.filter(function(x){ return x.periodo === p; })[0]; if (!f) return;
    var i = byId('inmuebles', c.inmuebleId), fa = i ? factorInm(i) : 1; if (!fa) return;
    r.total += f.debe * fa;
    if (f.estado === 'pagado') { r.pagado += f.debe * fa; r.nPagado++; }
    else if (f.estado === 'parcial') { r.parcial += (f.debe - f.pagado) * fa; r.parcialPag += f.pagado * fa; r.pagado += f.pagado * fa; r.nParcial++; }
    else if (f.estado === 'vencido') { r.vencido += f.debe * fa; r.nVencido++; }
    else { r.pendiente += f.debe * fa; r.nPendiente++; }
  });
  r.nPagado += ' contrato' + (r.nPagado === 1 ? '' : 's'); r.nParcial += ' contr.'; r.nPendiente += ' contr.'; r.nVencido += ' contr.';
  return r;
}
function kpi(l, v, s){ return '<div class="kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '&nbsp;') + '</div></div>'; }

var TIPOS_INM = ['Departamento', 'Casa', 'Dúplex', 'Local comercial', 'Oficina', 'Cochera', 'Galpón', 'Terreno', 'Otro'];
var IDENTIF = [
  ['rentas', 'N° cuenta Rentas (Inmobiliario)', 'https://www.rentascordoba.gob.ar/'],
  ['municipal', 'Cuenta municipal', ''],
  ['catastro', 'Nomenclatura catastral', ''],
  ['matricula', 'Matrícula / Folio', ''],
  ['epec', 'Suministro EPEC', 'https://www.epec.com.ar/'],
  ['agua', 'Cuenta agua', ''],
  ['gas', 'Cuenta gas', 'https://www.ecogas.com.ar/'],
  ['expensas', 'Administración / consorcio', '']
];
var FILTRO_INM = '';

function renderInmuebles(){
  var lista = vivos('inmuebles').filter(function(i){
    if (VISTA !== 'total' && !factorInm(i)) return false;
    var q = FILTRO_INM.toLowerCase(); if (!q) return true;
    var c = contratoVigenteDe(i.id);
    return (i.nombre + ' ' + (i.direccion || '') + ' ' + (c && c.locatario ? c.locatario.nombre : '')).toLowerCase().indexOf(q) >= 0;
  }).sort(function(a, b){ return a.nombre.localeCompare(b.nombre); });
  var porDueno = INM_MODO === 'dueno';
  $('p-inmuebles').innerHTML =
    '<h2>Inmuebles</h2><p class="sub">' + lista.length + ' inmuebles' + (VISTA !== 'total' ? ' con participación de ' + esc(nombreSocio(VISTA)) : '') + '</p>' +
    '<div class="bar"><div class="seg-ctl"><button class="' + (porDueno ? 'on' : '') + '" onclick="setInmModo(\'dueno\')">Por dueño</button><button class="' + (!porDueno ? 'on' : '') + '" onclick="setInmModo(\'inmueble\')">Por inmueble</button></div>' +
    '<input class="f grow" placeholder="Buscar por nombre, dirección o locatario…" value="' + esc(FILTRO_INM) + '" oninput="FILTRO_INM=this.value;renderInmuebles();this.focus();this.setSelectionRange(this.value.length,this.value.length)"><button class="btn p" onclick="modalInmueble()">+ Inmueble</button></div>' +
    (!lista.length ? '<div class="card empty">No hay inmuebles cargados.</div>' : porDueno ? htmlPorDueno(lista) : '<div class="grid g3">' + lista.map(cardInmueble).join('') + '</div>');
}
var INM_MODO = localStorage.getItem('inmoflow_inmmodo') || 'dueno';
var DUENOS_ABIERTOS = {};
function setInmModo(m){ INM_MODO = m; localStorage.setItem('inmoflow_inmmodo', m); renderInmuebles(); }

// Agrupa por combinación de titulares: "Cuffia Patricio", "Cuffia Benjamín", "Cuffia Patricio y Cuffia Benjamín (50/50)"…
function grupoDueno(i){
  var t = distribucionInm(i).slice().sort(function(a, b){ return DB.config.socios.findIndex(function(s){ return s.id === a.socioId; }) - DB.config.socios.findIndex(function(s){ return s.id === b.socioId; }); });
  return {
    key: t.map(function(x){ return x.socioId + ':' + x.pct; }).join('|'),
    nombre: t.map(function(x){ return nombreSocio(x.socioId); }).join(' y '),
    detalle: t.length > 1 ? 'Condominio ' + t.map(function(x){ return r2(x.pct) + '%'; }).join(' / ') : 'Titular único',
    socios: t.map(function(x){ return x.socioId; }), compartido: t.length > 1
  };
}
function iniciales(n){ return String(n || '').split(/\s+/).filter(Boolean).map(function(w){ return w.charAt(0); }).join('').slice(0, 2).toUpperCase(); }
function htmlPorDueno(lista){
  var grupos = {}, orden = [], ph = perHoy();
  lista.forEach(function(i){ var g = grupoDueno(i); if (!grupos[g.key]) { grupos[g.key] = { g: g, inms: [] }; orden.push(g.key); } grupos[g.key].inms.push(i); });
  orden.sort(function(a, b){ var A = grupos[a].g, B = grupos[b].g; return (A.compartido - B.compartido) || A.nombre.localeCompare(B.nombre); });
  if (FILTRO_INM) orden.forEach(function(k){ DUENOS_ABIERTOS[k] = true; });
  return '<div class="duenos">' + orden.map(function(k){
    var G = grupos[k], abierto = !!DUENOS_ABIERTOS[k];
    var alq = 0, cobr = 0, deuda = 0, libres = 0, nPag = 0, nCtr = 0;
    G.inms.forEach(function(i){
      var c = contratoVigenteDe(i.id); if (!c) { libres++; return; }
      var f = cuentaCorriente(c).filas.filter(function(x){ return x.periodo === ph; })[0];
      alq += montoVigente(c, ph);
      if (f) { nCtr++; cobr += f.pagado; if (f.estado === 'pagado') nPag++; }
      deuda += sum(deudaContrato(c), function(x){ return x.debe - x.pagado; });
    });
    var av = G.g.socios.map(function(s){ return '<span class="av">' + esc(iniciales(nombreSocio(s))) + '</span>'; }).join('');
    return '<div class="dueno' + (abierto ? ' open' : '') + '">' +
      '<button class="dueno-h" onclick="DUENOS_ABIERTOS[\'' + k + '\']=!DUENOS_ABIERTOS[\'' + k + '\'];renderInmuebles()" aria-expanded="' + abierto + '">' +
        '<span class="avs">' + av + '</span>' +
        '<span class="dueno-n"><b>' + esc(G.g.nombre) + '</b><span class="small muted">' + esc(G.g.detalle) + ' · ' + G.inms.length + (G.inms.length === 1 ? ' inmueble' : ' inmuebles') + (libres ? ' · ' + libres + ' libre' + (libres > 1 ? 's' : '') : '') + '</span></span>' +
        '<span class="dueno-k"><span class="small muted">Alquileres ' + perNom(ph).split(' ')[0].toLowerCase() + '</span><b>' + fmt(alq) + '</b></span>' +
        (nCtr ? '<span class="dueno-k"><span class="small muted">Cobrado</span><b>' + nPag + ' / ' + nCtr + '</b></span>' : '<span class="dueno-k"><span class="small muted">Cuenta</span><b>desde ' + esc(perNom(G.inms.map(function(i){ var c = contratoVigenteDe(i.id); return c && c.ccDesde || ''; }).sort().pop() || ph).toLowerCase()) + '</b></span>') +
        (deuda > 0 ? '<span class="tag t-bad">Deuda ' + fmt(deuda) + '</span>' : '<span class="tag t-ok">Al día</span>') +
        '<span class="chev">' + (abierto ? '▴' : '▾') + '</span>' +
      '</button>' +
      (abierto ? '<div class="dueno-b">' + G.inms.sort(function(a, b){ return a.nombre.localeCompare(b.nombre); }).map(tileInmueble).join('') +
        '<button class="tile tile-add" onclick="modalInmueble(null,\'' + k + '\')"><span>+</span>Agregar inmueble a ' + esc(G.g.nombre) + '</button></div>' : '') +
    '</div>';
  }).join('') + '</div>';
}
function tileInmueble(i){
  var c = contratoVigenteDe(i.id), ph = perHoy();
  var f = c ? cuentaCorriente(c).filas.filter(function(x){ return x.periodo === ph; })[0] : null;
  return '<button class="tile" onclick="verInmueble(\'' + i.id + '\')">' +
    '<span class="tile-t"><b>' + esc(i.nombre) + '</b>' + (c && f ? tagEstado(f.estado) : tagEstado(c ? 'alquilado' : 'libre')) + '</span>' +
    '<span class="small muted">' + esc(i.direccion || i.tipo || '') + '</span>' +
    (c ? '<span class="tile-r"><span>' + esc(c.locatario.nombre) + '</span><b>' + fmt(montoVigente(c, ph)) + '</b></span>' : '<span class="tile-r muted">Sin contrato vigente</span>') +
  '</button>';
